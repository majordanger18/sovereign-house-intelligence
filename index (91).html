async function doSaveCalc(){
  if(!calcProp)return;
  const btn=document.getElementById("calcSaveBtn");
  btn.textContent="Saving...";btn.style.opacity="0.6";

  const arv=gv("c_arv"),pur=gv("c_pur"),rehab=gv("c_rehab"),addl=gv("c_addl");
  const ltv=gv("c_ltv"),rate=gv("c_rate"),pts=gv("c_pts"),orig=gv("c_orig"),closeBuyFlat=gv("c_closebuy"),drawPct=gv("c_drawpct");
  const holdMo=gv("c_hold"),taxAnn=gv("c_tax"),ins=gv("c_ins"),hoa=gv("c_hoa"),util=gv("c_util");
  const bagent=gv("c_bagent"),closeSellFlat=gv("c_closesell"),staging=gv("c_staging"),title=gv("c_title"),hoaxfer=gv("c_hoaxfer"),misc=gv("c_misc");
  const lisaCommPct2=parseFloat(document.getElementById("c_lisacomm")?.value||2.5);
  const lisaCommAmt2=Math.round(pur*(lisaCommPct2/100));

  const totalReno=rehab+addl;
  const svcfee=gv("c_svcfee");
  const loanAmt=Math.round(pur*(ltv/100)),renoFin=Math.round(totalReno*(drawPct/100)),totalLoan=loanAmt+renoFin;
  const loanFees=Math.round(totalLoan*(pts/100))+Math.round(totalLoan*(orig/100))+closeBuyFlat+svcfee;
  const monthlyH=Math.round(totalLoan*(rate/100)/12)+Math.round(taxAnn/12)+ins+hoa+util;
  const totalHold=monthlyH*holdMo;
  const totalSell=Math.round(arv*(bagent/100))+closeSellFlat+staging+title+hoaxfer+misc+(arv>0?Math.ceil(arv/500)*2.55:0);
  const totalCost=pur+totalReno+loanFees+totalHold+totalSell-lisaCommAmt2;
  const profit=arv-totalCost;
  const roi=totalCost>0?parseFloat(((profit/totalCost)*100).toFixed(1)):0;
  const profitMargin=arv>0?parseFloat(((profit/arv)*100).toFixed(1)):0;

  const downPay=pur-Math.round(pur*(ltv/100));
  const cashIn=downPay+totalReno*(1-drawPct/100)+loanFees;
  const cashROI2=cashIn>0?parseFloat(((profit/cashIn)*100).toFixed(1)):0;

  try{
    const resp=await fetch(`${SB}/rest/v1/calc_history`,{method:"POST",headers:{...HD,Prefer:"return=representation"},body:JSON.stringify({
      property_id:calcProp.id,mls_number:calcProp.mls_number,address:calcProp.address,
      arv,purchase_price:pur,rehab_budget:rehab,additional_costs:addl,
      ltv,interest_rate:rate,points:pts,origination:orig,closing_buy_flat:closeBuyFlat,reno_draw_pct:drawPct,
      loan_amount:totalLoan,down_payment:downPay,loan_fees:loanFees,
      hold_months:holdMo,tax_annual:taxAnn,insurance_monthly:ins,hoa_monthly:hoa,utilities_monthly:util,
      monthly_hold:monthlyH,hold_cost:totalHold,
      buyer_agent_pct:bagent,closing_sell_flat:closeSellFlat,staging,title_insurance:title,hoa_transfer:hoaxfer,misc_buffer:misc,
      total_sell_costs:totalSell,
      lisa_commission_pct:lisaCommPct2,lisa_commission_amt:lisaCommAmt2,
      total_cost:totalCost,net_profit:profit,roi,
      cash_required:cashIn,cash_roi:cashROI2
    })});
    if(!resp.ok){
      const errText=await resp.text();
      console.error("Save failed:",resp.status,errText);
      btn.textContent="❌ Save Failed";btn.style.background="rgba(239,68,68,0.15)";btn.style.color="#ef4444";btn.style.opacity="1";
      const errDiv=document.createElement("div");
      errDiv.style.cssText="margin-top:8px;padding:10px;border-radius:8px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15);font-size:11px;color:#ef4444;word-break:break-all";
      errDiv.textContent=`Error ${resp.status}: ${errText.substring(0,200)}`;
      btn.parentNode.insertBefore(errDiv,btn.nextSibling);
      setTimeout(()=>{btn.textContent="💾 Save Analysis";btn.style.background="rgba(212,175,55,0.9)";btn.style.color="#0a0a0a";errDiv.remove();},6000);
      return;
    }
    const updated=await sb(`calc_history?mls_number=eq.${calcProp.mls_number}&order=created_at.desc`);
    calcHistory=Array.isArray(updated)?updated:[];
    btn.textContent="✓ Saved!";btn.style.background="rgba(34,197,94,0.15)";btn.style.color="#22c55e";btn.style.opacity="1";
    setTimeout(()=>{btn.textContent="💾 Save Analysis";btn.style.background="rgba(212,175,55,0.9)";btn.style.color="#0a0a0a";},2500);
  }catch(e){
    console.error("Save error:",e);
    btn.textContent="❌ Network Error";btn.style.background="rgba(239,68,68,0.15)";btn.style.color="#ef4444";btn.style.opacity="1";
    setTimeout(()=>{btn.textContent="💾 Save Analysis";btn.style.background="rgba(212,175,55,0.9)";btn.style.color="#0a0a0a";},4000);
  }
}

function markRead(aid){
  aid=String(aid);
  const dismissed=JSON.parse(localStorage.getItem("sh_dismissed_alerts")||"[]");
  if(!dismissed.includes(aid))dismissed.push(aid);
  localStorage.setItem("sh_dismissed_alerts",JSON.stringify(dismissed));
  fetch(SB+"/rest/v1/alerts?id=eq."+aid,{method:"PATCH",headers:{"apikey":AK,"Authorization":"Bearer "+AK,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({is_read:true})}).catch(()=>{});
}
function removeAlertRow(aid,cb){
  const wrap=document.querySelector(`.swipe-wrap[data-aid="${aid}"]`);
  if(wrap){wrap.style.transition="all 0.3s ease";wrap.style.maxHeight="0px";wrap.style.opacity="0";wrap.style.margin="0";wrap.style.padding="0";wrap.style.overflow="hidden";setTimeout(()=>{markRead(aid);updateAlertBadge();updateAlertPageCount();if(cb)cb();},320);}
  else{markRead(aid);updateAlertBadge();updateAlertPageCount();if(cb)cb();}
}
function updateAlertBadge(){
  const dismissed=JSON.parse(localStorage.getItem("sh_dismissed_alerts")||"[]");

  if(visible.length>0){badge.style.display="flex";document.getElementById("alertCount").textContent=visible.length;}
  else{badge.style.display="none";document.getElementById("alertToast").innerHTML="";}
}
function updateAlertPageCount(){
  const dismissed=JSON.parse(localStorage.getItem("sh_dismissed_alerts")||"[]");

function dismissAllAlerts(){

function openAlerts(){
  const dismissed=JSON.parse(localStorage.getItem("sh_dismissed_alerts")||"[]");
  const visible=alerts.filter(a=>!dismissed.includes(String(a.id)));
  const renderAlert=a=>{
    const matchProp=props.find(p=>p.mls_number&&a.mls_number&&p.mls_number===a.mls_number);
    const propId=matchProp?matchProp.id:null;
    const addr=matchProp?matchProp.address:(a.message||'').replace(/\s*(went|price|dropped|from|–).*/i,'').replace(/\s*\$[\d,.]+.*/,'').trim()||'Unknown';
    const ico=a.alert_type==="NEW_LISTING"?"🆕":a.alert_type==="PRICE_CHANGE"?"💰":a.alert_type==="STATUS_CHANGE"?"🏠":a.alert_type?.includes("WATCHLIST")?"⭐":"📋";
    const col=a.alert_type==="NEW_LISTING"?"#22c55e":a.alert_type==="PRICE_CHANGE"?"#f59e0b":a.alert_type==="STATUS_CHANGE"?"#a855f7":a.alert_type?.includes("WATCHLIST")?"#d4af37":"#94a3b8";
    let label='',line1='',line2='';
    if(a.alert_type==="PRICE_CHANGE"){
      label="PRICE DROP";
      line1=addr;
      const oldP=a.old_value?Number(a.old_value):null,newP=a.new_value?Number(a.new_value):null;
      if(oldP&&newP){const pct=Math.round(((oldP-newP)/oldP)*100);line2='$'+oldP.toLocaleString()+' → $'+newP.toLocaleString()+(pct>0?' (↓'+pct+'%)':'');}
      else{line2=a.details||a.message||'';}
    }else if(a.alert_type==="STATUS_CHANGE"){
      label="WENT PENDING";
      const nv=(a.new_value||'').toLowerCase();
      if(nv.includes('active')&&!nv.includes('pending')&&!nv.includes('contract')){label="BACK ON MARKET";}
      else if(nv.includes('closed')||nv.includes('sold')){label="SOLD";}
      else if(nv.includes('cancel')||nv.includes('withdraw')){label="CANCELLED";}
      line1=addr;
      line2='';
    }else if(a.alert_type==="NEW_LISTING"){
      label="NEW LISTING";
      if(matchProp){line1=addr+' — $'+Number(matchProp.list_price).toLocaleString();line2=(matchProp.bedrooms||'?')+'bd/'+(matchProp.bathrooms||'?')+'ba · '+(matchProp.sqft?matchProp.sqft.toLocaleString()+'sf':'?');}
      else{const rawMsg=a.message||'';const priceMatch=rawMsg.match(/\$?([\d,]+(?:\.\d+)?)/);const price=priceMatch?'$'+Number(priceMatch[1].replace(/,/g,'')).toLocaleString():'';line1=addr+(price?' — '+price:'');line2=a.details||'';}
    }else{
      label=a.alert_type||"ALERT";line1=a.message||'';line2=a.details||'';
    }
    return`<div class="swipe-wrap" data-aid="${a.id}"><div class="swipe-bg"><span>Delete</span></div><div class="swipe-card" onclick="${propId?`closeAlerts();openDetail('${propId}')`:''}" style="${propId?'cursor:pointer':''}"><span style="color:${col};flex-shrink:0;font-size:20px">${ico}</span><div style="flex:1;min-width:0"><span style="font-size:9px;font-weight:800;letter-spacing:1px;color:${col};text-transform:uppercase">${label}</span><div style="color:#e2e8f0;font-weight:600;font-size:13px;margin-top:2px">${esc(line1)}</div>${line2?`<div style="font-size:11px;color:#94a3b8;margin-top:2px">${esc(line2)}</div>`:''}<div style="font-size:9px;color:#475569;margin-top:3px">${a.created_at?new Date(a.created_at).toLocaleString():""}</div></div><button onclick="event.stopPropagation();dismissOne('${a.id}')" class="alert-x">✕</button></div></div>`;
  };
  const m=document.getElementById("alertModal");
  m.innerHTML=`<div class="sheet" style="position:relative"><div class="handle"></div><button class="close-x" onclick="closeAlerts()">✕</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-right:40px">
      <div>
        <div style="font-size:9px;color:#d4af37;font-weight:800;letter-spacing:3px">ALERTS</div>
        <div id="alertPageCount" style="font-size:14px;font-weight:700;color:#94a3b8;margin-top:2px">${visible.length} alert${visible.length!==1?"s":""}</div>
      </div>
      ${visible.length>0?`<button onclick="dismissAllAlerts()" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:10px;color:#ef4444;font-size:12px;font-weight:700;padding:8px 16px;cursor:pointer;min-height:40px">Clear All</button>`:""}
    </div>
    <div id="alertListArea" style="overflow-y:auto;max-height:calc(100dvh - 200px);-webkit-overflow-scrolling:touch">
      ${visible.length>0?visible.map(renderAlert).join(""):`<div style="text-align:center;padding:40px 20px;color:#475569"><div style="font-size:32px;margin-bottom:8px">✅</div><div style="font-size:14px;font-weight:600">All clear — no alerts</div></div>`}
    </div>
  </div>`;
  m.style.display="block";
  document.body.style.overflow="hidden";
  requestAnimationFrame(initSwipe);
}
function closeAlerts(){document.getElementById("alertModal").style.display="none";if(document.getElementById("detailModal").style.display==="block"){document.body.style.overflow="hidden";}else{document.body.style.overflow="";}}

function initSwipe(){
  document.querySelectorAll(".swipe-card").forEach(card=>{
    let sx=0,cx=0,sw=false;const wrap=card.closest(".swipe-wrap");
    card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;cx=sx;sw=true;card.style.transition="none";},{passive:true});
    card.addEventListener("touchmove",e=>{if(!sw)return;cx=e.touches[0].clientX;const dx=cx-sx;if(dx<0){card.style.transform=`translateX(${dx}px)`;}},{passive:true});
    card.addEventListener("touchend",()=>{if(!sw)return;sw=false;const dx=cx-sx;const aid=wrap.dataset.aid;
      if(dx<-60){card.style.transition="transform 0.2s ease";card.style.transform="translateX(-110%)";setTimeout(()=>{removeAlertRow(aid);},200);}
      else{card.style.transition="transform 0.15s ease";card.style.transform="translateX(0)";}
    });
  });
}

  const p=props.find(x=>x.id===id);if(!p)return;
  const ai=analysisMap[id]||{};

  // ── FETCH LAST SAVED CALC RUN (source of truth) ──
  let calcRun=null;
  try{
    const ch=await sb(`calc_history?property_id=eq.${id}&order=created_at.desc&limit=1`);
    if(Array.isArray(ch)&&ch.length>0) calcRun=ch[0];
  }catch(e){console.warn("No calc history:",e);}
  // Also try by MLS number if property_id didn't match
  if(!calcRun&&p.mls_number){
    try{

function updateOfferCalc(id){
  // ── IDENTICAL MATH TO CALCULATOR (updateCalc) ──
  const p=props.find(x=>x.id===id);if(!p||!offerParams)return;
  const oPrice=Number(document.getElementById("o_price")?.value)||0;
  const lisaPct=parseFloat(document.getElementById("o_lisacomm")?.value||offerParams.lisaPct);
  const lisaAmt=Math.round(oPrice*(lisaPct/100));
  const q=offerParams;

  // These mirror the calculator exactly:
  const totalReno=q.reno;
  const loanAmt=Math.round(oPrice*(q.ltv/100));
  const renoFinanced=Math.round(totalReno*(q.drawPct/100));
  const totalLoan=loanAmt+renoFinanced;
  const loanPts=Math.round(totalLoan*(q.pts/100));
  const loanOrig=Math.round(totalLoan*(q.orig/100));
  const totalLoanFees=loanPts+loanOrig+q.closeBuy+q.svcfee;

  const monthlyInterest=Math.round(totalLoan*(q.rate/100)/12);
  const monthlyTax=Math.round(q.taxAnn/12);
  const monthlyTotal=monthlyInterest+monthlyTax+q.ins+q.hoa+q.util;
  const totalHold=monthlyTotal*q.holdMo;

  const arv=q.arv;
  const buyerComm=Math.round(arv*(q.bagent/100));
  const rptt=arv>0?Math.ceil(arv/500)*2.55:0;
  const totalSell=buyerComm+q.closeSell+q.staging+q.title+q.hoaxfer+q.misc+rptt;

  const totalCost=oPrice+totalReno+totalLoanFees+totalHold+totalSell-lisaAmt;
  const profit=arv-totalCost;
  const roi=totalCost>0?(profit/totalCost*100):0;
  const disc=p.list_price>0?((p.list_price-oPrice)/p.list_price*100).toFixed(1):0;

  // Store computed values for generateOfferPackage
  offerParams._lastProfit=profit;
  offerParams._lastRoi=roi;
  offerParams._lastTotalCost=totalCost;

  const el=x=>document.getElementById(x);
  const pp=el("ofr_price");if(pp)pp.textContent=$(oPrice);
  const pd=el("ofr_disc");if(pd){pd.textContent=oPrice<p.list_price?disc+'% below ask':(oPrice>p.list_price?Math.abs(disc)+'% above':'At list');pd.style.color=oPrice<=p.list_price?"#22c55e":"#ef4444";}
  const pr=el("ofr_profit");if(pr){pr.textContent=$k(profit);pr.style.color=profit>=150000?"#22c55e":profit>=75000?"#f59e0b":"#ef4444";}
  const ro=el("ofr_roi");if(ro)ro.textContent=roi.toFixed(1)+'% ROI';
  const la=el("ofrLisaAmt");if(la)la.textContent=lisaPct>0?$(lisaAmt)+' income credit':'No commission this deal';
}

  const coeDays=d.close_of_escrow_days||30;

  const financeDays=d.financing_contingency_days||21;
  const coeDate=new Date();coeDate.setDate(coeDate.getDate()+coeDays);
  const coeDateStr=(coeDate.getMonth()+1)+"/"+coeDate.getDate()+"/"+coeDate.getFullYear();
  const respDate=new Date();respDate.setDate(respDate.getDate()+3);
  const respStr=(respDate.getMonth()+1)+"/"+respDate.getDate()+"/"+respDate.getFullYear();

  const rpaData={
    property_address:(d.address||"")+", "+(d.city||"Las Vegas")+", NV "+(d.zip_code||""),
    city:d.city||"Las Vegas", county:"Clark", zip_code:d.zip_code||"", apn:d.apn||"",
    purchase_price:String(oPrice),
    offer_date:new Date().toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}),
    buyer_name:"Sovereign House LLC", occupy:false,
    emd_amount:String(emd), emd_type:"wire", emd_deposit_days:"1", emd_account:"escrow",
    loan_type:"other", loan_other_specify:"Hard Money (Kiavi)",
    loan_amount:String(oPrice), balance_down_payment:String(Math.round(oPrice*0.10)),
    buyer_broker_pct:"0", loan_app_days:"5", appraisal_days:"21",
    loan_contingency_days:String(financeDays),
    escrow_company:"Nevada Title Company", coe_date:coeDateStr,
    due_diligence:true, due_diligence_days:String(inspDays),
    walkthrough_days:"5", hpp:"waive",
    possession:d.possession==="seller_rentback"?"other":"coe",
    buyer_initials:"SH",
    additional_terms:d.special_terms||"Property to be sold in AS-IS condition. Buyer to conduct informational inspections only.\nNo repair requests will be made by Buyer.\nBuyer is a licensed Nevada real estate entity. Lisa A. Hunt, Managing Partner, is the Buyer's authorized representative and licensed Nevada Realtor (Simply Vegas).\nBuyer intends to renovate and resell the property (investment purchase).",
    addenda_line1:"Proof of Funds Addendum",
    respond_by_date:respStr, respond_by_time:"6:00 PM",
    listing_agent_name:d.listing_agent_name||"",
    listing_company:d.listing_agent_brokerage||"",
    listing_broker_name:d.listing_agent_brokerage||"",
    listing_agent_phone:d.listing_agent_phone||"",
    listing_agent_email:d.listing_agent_email||"",
    licensee_interest:true, licensee_relationship:"Managing Partner of Buyer entity",
  };
  const encoded=encodeURIComponent(JSON.stringify(rpaData));
  window.open("offer-builder.html?prefill="+encoded,"_blank");
}

// ═══ MAGIC LINK SUPPORT ═══
function checkMagicLink(){
  const params=new URLSearchParams(window.location.search);
  if(!params.has("addr"))return;
  const ml={
    address:params.get("addr")||"",
    arv:Number(params.get("arv"))||0,
    purchase_price:Number(params.get("pur"))||0,
    rehab_budget:Number(params.get("rehab"))||0,
    additional_costs:Number(params.get("addl"))||0,
    ltv:Number(params.get("ltv"))||90,
    interest_rate:Number(params.get("rate"))||11.49,
    points:Number(params.get("pts"))||0,
    origination:Number(params.get("orig"))||1.5,
    closing_buy_flat:Number(params.get("closebuy"))||5000,
    reno_draw_pct:Number(params.get("drawpct"))||100,
    hold_months:Number(params.get("hold"))||8,
    tax_annual:Number(params.get("tax"))||0,
    insurance_monthly:Number(params.get("ins"))||250,
    hoa_monthly:Number(params.get("hoa"))||450,
    utilities_monthly:Number(params.get("util"))||650,
    buyer_agent_pct:Number(params.get("bagent"))||2.5,
    closing_sell_flat:Number(params.get("closesell"))||3500,
    staging:Number(params.get("staging"))||5000,
    title_insurance:Number(params.get("title"))||2000,
    hoa_transfer:Number(params.get("hoaxfer"))||500,
    misc_buffer:Number(params.get("misc"))||1500
  };
  const addr=ml.address.toLowerCase().split(",")[0].trim();
  const match=props.find(p=>(p.address||"").toLowerCase().includes(addr));
  if(match){
    calcProp=match;calcHistory=[];
    renderCalc(ml);
    document.getElementById("calcModal").style.display="block";
    document.body.style.overflow="hidden";
  } else {
    alert("Property not found in dashboard: "+ml.address+"\nMake sure it exists in your MLS feed.");
  }
  window.history.replaceState({},"",window.location.pathname);
}

loadData().then(()=>{setTimeout(checkMagicLink,800);});
