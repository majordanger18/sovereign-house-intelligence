<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#09090b"/>
<title>Sovereign House Intelligence v3.2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#09090b;color:#f1f5f9;font-family:'DM Sans',-apple-system,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,button,textarea{font-family:inherit;-webkit-appearance:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

input[type="range"]{-webkit-appearance:none;appearance:none;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#d4af37;cursor:pointer;border:2px solid #0a0a0a;box-shadow:0 0 6px rgba(212,175,55,0.4)}
input[type="range"]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#d4af37;cursor:pointer;border:2px solid #0a0a0a;box-shadow:0 0 6px rgba(212,175,55,0.4)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:900;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet{background:#111113;border-radius:24px 24px 0 0;min-height:50vh;padding:8px 20px calc(40px + env(safe-area-inset-bottom));margin-top:40px;animation:sheetUp .3s ease}
@media(min-width:768px){.sheet{border-radius:20px;margin:40px auto;max-width:680px}}
.handle{width:40px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:8px auto 16px}
@media(min-width:768px){.handle{display:none}}
.close-x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:none;color:#94a3b8;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;border-radius:12px;font-weight:700;min-height:48px;transition:transform .1s}
.btn:active{transform:scale(0.97)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:650;white-space:nowrap}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filt{padding:0 16px;min-height:40px;border-radius:20px;font-size:12px;white-space:nowrap;font-weight:700;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#64748b;cursor:pointer;display:flex;align-items:center}
.filt.on{border-color:rgba(212,175,55,0.35);background:rgba(212,175,55,0.08);color:#d4af37}
.card{border-radius:16px;padding:14px;cursor:pointer;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.015);transition:transform .1s;overflow:hidden}
.card:active{transform:scale(0.99)}
.card.watched{background:rgba(212,175,55,0.03);border-color:rgba(212,175,55,0.2)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.dgrid{grid-template-columns:repeat(2,1fr)}}
.cinput{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#f1f5f9;font-size:16px;font-weight:700;outline:none;min-height:44px}
.sec-toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
.sec-toggle:active{opacity:0.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:380px){.row2{grid-template-columns:1fr}}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:10px;color:#64748b;font-weight:700;letter-spacing:0.5px;margin-bottom:4px}
.fld .sub{font-size:9px;color:#475569;margin-top:2px}
.wb{padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);text-align:center}
.wb .wl{font-size:9px;color:#64748b;font-weight:700;letter-spacing:1px}
.wb .wv{font-size:16px;font-weight:800;margin-top:2px}
.list-area{display:flex;flex-direction:column}
@media(min-width:768px){
  .main-wrap{max-width:1200px;margin:0 auto}
  .list-area{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
}
.card{min-width:0}
@media(min-width:1100px){
  .list-area{grid-template-columns:repeat(3,1fr)}
}
.swipe-wrap{position:relative;overflow:hidden;border-radius:8px;margin:4px 0}
.swipe-bg{position:absolute;inset:0;background:#ef4444;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;border-radius:8px}
.swipe-bg span{color:#fff;font-size:12px;font-weight:700;letter-spacing:1px}
.swipe-card{position:relative;display:flex;align-items:center;gap:10px;padding:12px 10px;background:#0f1218;border-radius:8px;cursor:pointer;min-height:48px;z-index:1;transition:none;will-change:transform}
.alert-x{flex-shrink:0;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;color:#ef4444;font-size:14px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){.alert-x{display:none}}
#stickyHeader{transition:box-shadow .2s;background:#09090b}
#stickyHeader .sh-inner{max-width:1200px;margin:0 auto}
#stickyHeader.scrolled{box-shadow:0 4px 24px rgba(0,0,0,0.6)}
</style>
</head>
<body>

<div id="loading" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="width:36px;height:36px;border:3px solid rgba(212,175,55,0.2);border-top-color:#d4af37;border-radius:50%;animation:spin .8s linear infinite"></div>
  <div style="color:#d4af37;font-size:12px;font-weight:700;letter-spacing:3px">SOVEREIGN HOUSE</div>
</div>

<div id="main" class="main-wrap" style="display:none">
  <div id="stickyHeader" style="position:sticky;top:0;z-index:100;background:#09090b;padding-bottom:4px;">
    <div style="padding:calc(20px + env(safe-area-inset-top)) 20px 10px;background:linear-gradient(180deg,rgba(212,175,55,0.03),transparent)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:9px;color:#d4af37;font-weight:800;letter-spacing:4px">SOVEREIGN HOUSE</div>
          <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:900;margin-top:2px">Intelligence</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="alertBadge" style="display:none;cursor:pointer;background:#d4af37;color:#0a0a0a;font-size:12px;font-weight:800;border-radius:20px;padding:6px 12px;min-height:32px;align-items:center;gap:4px">🔔 <span id="alertCount">0</span></div>
          <button onclick="togglePulse()" class="btn" style="padding:0 14px;min-height:42px;font-size:16px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#94a3b8">📊</button>
          <button onclick="this.style.opacity='0.4';loadData().then(()=>{this.style.opacity='1';checkHealth();})" class="btn" style="padding:0 12px;min-height:42px;font-size:14px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#94a3b8">↻</button>
        </div>
      </div>
      <div id="statsArea" class="stat-grid" style="margin-top:10px"></div>
    </div>
    <div id="alertToast"></div>
    <div id="pulseArea"></div>
    <div style="margin-top:4px"><div id="filtersArea" class="filters"></div></div>
    <div style="padding:8px 20px 0;display:flex;gap:8px">
      <div style="flex:1;position:relative">
        <input id="searchBox" type="text" placeholder="Search address, MLS#, zip..." style="width:100%;padding:10px 36px 10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#f1f5f9;font-size:16px;outline:none;min-height:44px"/>
        <button id="searchClear" onclick="document.getElementById('searchBox').value='';document.getElementById('searchBox').dispatchEvent(new Event('input'));this.style.display='none';" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#94a3b8;font-size:14px;cursor:pointer;align-items:center;justify-content:center">✕</button>
      </div>
      <select id="sortBox" style="padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:#131316;color:#f1f5f9;font-size:16px;font-weight:700;min-height:44px;min-width:130px;cursor:pointer">
        <option value="sovereign_score">Score ↓</option>
        <option value="price_asc">Price ↑</option>
        <option value="price_desc">Price ↓</option>
        <option value="dom">DOM ↓</option>
        <option value="ppsf">$/sf ↑</option>
        <option value="oldest">Oldest</option>
        <option value="newest">Newest</option>
      </select>
    </div>
    <div style="padding:6px 20px 2px"><span id="countLabel" style="font-size:11px;color:#475569;font-weight:600"></span></div>
    <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.15),transparent);margin:0 20px"></div>
  </div>
  <div id="listArea" class="list-area" style="padding:4px 20px 100px;gap:8px"></div>
</div>

<div id="detailModal" class="overlay" style="display:none"></div>
<div id="calcModal" class="overlay" style="display:none;z-index:1000"></div>
<div id="alertModal" class="overlay" style="display:none;z-index:950"></div>
<div id="offerModal" class="overlay" style="display:none;z-index:1100"></div>
<div id="dealModal" class="overlay" style="display:none;z-index:1150"></div>

<script>
const SB="https://jyzxbuzzxdlhnbumfthv.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5enhidXp6eGRsaG5idW1mdGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MDc1NDEsImV4cCI6MjA4NTk4MzU0MX0.dzsPjQQEeeyDEYAkIzaWrH0B5vGjuGSkL4MoqPo5MHs";
const HD={apikey:KEY,Authorization:`Bearer ${KEY}`,"Content-Type":"application/json",Prefer:"return=representation"};
// ═══ N8N WEBHOOK — paste your production webhook URL here ═══
const N8N_WEBHOOK="https://majordanger.app.n8n.cloud/webhook/underwrite";
async function sb(ep,opts={}){const r=await fetch(`${SB}/rest/v1/${ep}`,{...opts,headers:{...HD,...opts.headers}});return r.json();}
const $=n=>n!=null?`$${Number(n).toLocaleString()}`:"—";
const $k=n=>n?(n>=1e6?`$${(n/1e6).toFixed(2)}M`:`$${(n/1e3).toFixed(0)}K`):"—";
const sc=s=>s>=60?"#22c55e":s>=40?"#eab308":s>=20?"#f97316":"#64748b";
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function truncSub(n){if(!n)return'';let s=n.trim();if(s.toLowerCase()==='none')return'';if(/^summerlin\s+(village|west|south|north|east)/i.test(s))return'';s=s.replace(/\s*-[A-Z]-/g,' ');s=s.replace(/\s+(cntry|country)\s+club.*$/i,'');s=s.replace(/\s+by\s+[\w\s]+$/i,'');s=s.replace(/\s+(at|in|of)\s+(peccole|summerlin|the\s+lakes).*$/i,'');s=s.replace(/\s+summerlin(\s+.*)?$/i,'');s=s.replace(/\s*[-–]?\s*phase\s+.*$/i,'');s=s.replace(/\s+village\s+.*$/i,'');s=s.replace(/\s+parcels?\s+.*$/i,'');s=s.replace(/\s+amd.*$/i,'');s=s.replace(/\s+amended.*$/i,'');s=s.replace(/\s+plat\s+.*$/i,'');s=s.replace(/\s+tract\s+.*$/i,'');s=s.replace(/\s+unit\s+.*$/i,'');s=s.replace(/\s+[A-Z]\s*$/,'');s=s.replace(/\s+(north|south|east|west)\s*$/i,'');s=s.replace(/\s*[-–]+\s*$/,'');s=s.trim();if(s.toLowerCase()==='summerlin'||s==='')return'';return s;}
const KNOWN_GUARD_GATED=["queensridge","corta bella","tournament hills","the ridges","bear's best","bears best","red rock country club","red rock cc","canyon gate","canyon gate country club","spanish trail","calico ridge","eagle hills","anthem country club","anthem cc","macdonald highlands","macdonald ranch","roma hills","lake las vegas","southern highlands golf club","seven hills"];
function checkGuardGated(p){if(p.is_guard_gated)return true;const rem=((p.description||"")+" "+(p.public_remarks||"")+" "+(p.listing_remarks||"")+" "+(p.remarks||"")).toLowerCase();if(rem.includes("guard-gated")||rem.includes("guard gated"))return true;const sub=(p.subdivision_name||"").toLowerCase();return KNOWN_GUARD_GATED.some(g=>sub.includes(g));}

let props=[],watchIds=new Set(),watchMap={},alerts=[],analysisMap={},deals=[],toastDismissed=localStorage.getItem("sh_toast_dismissed")===new Date().toDateString();
window.addEventListener("scroll",()=>{const h=document.getElementById("stickyHeader");if(h){h.classList.toggle("scrolled",window.scrollY>10);}},{passive:true});
const isPend=p=>p.status==="Pending"||p.status==="ActiveUnderContract"||p.listing_status==="Pending"||p.listing_status==="ActiveUnderContract";
let view="all",showPulse=false;

function ring(score,sz=44){
  const r=(sz-6)/2,c=2*Math.PI*r,p=Math.min((score||0)/100,1),col=sc(score);
  return`<div style="position:relative;width:${sz}px;height:${sz}px;flex-shrink:0"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" stroke-linecap="round"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:${col}">${score||0}</div></div>`;
}
function tag(t,col="#64748b",ico=""){return`<span class="tag" style="color:${col};background:${col}12">${ico?`<span style="font-size:10px">${ico}</span>`:""}${t}</span>`;}

const GOLF_COMMUNITIES=["red rock country club","tpc summerlin","tournament hills","canyon gate","siena","bears best","bear's best","anthem country club","dragon ridge","southern highlands golf","rio secco","revere golf","chimera golf"];
function isGolf(p){
  const sub=(p.subdivision_name||"").toLowerCase(),desc=(p.description||"").toLowerCase();
  if(GOLF_COMMUNITIES.some(g=>sub.includes(g)||desc.includes(g)))return"community";
  if(desc.match(/golf\s*(course|lot|front|view|fairway)/i)||desc.match(/on\s*the\s*(course|fairway|green)/i)||desc.match(/backs?\s*to\s*(golf|the\s*(course|fairway))/i))return"frontage";
  if(desc.includes("golf"))return"community";
  return false;
}

// ═══ DATA ═══
async function loadData(){
  try{
    const[p,w,a,ua,d]=await Promise.all([sb("properties?status=neq.Closed&order=sovereign_score.desc"),sb("watchlist?status=eq.Watching"),sb("alerts?is_read=eq.false&order=created_at.desc&limit=50"),sb("underwriting_analyses?select=property_id,verdict,profit_target,roi_target,max_offer_price,max_offer_raw,max_offer_tier,max_offer_flag,max_offer_discount_pct,list_price,created_at&order=created_at.desc"),sb("deals?order=updated_at.desc")]);
    props=Array.isArray(p)?p:[];
    deals=Array.isArray(d)?d:[];
    const wm={},ws=new Set();
    (Array.isArray(w)?w:[]).forEach(x=>{if(x.property_id){ws.add(x.property_id);wm[x.property_id]=x.id;}});
    watchIds=ws;watchMap=wm;alerts=Array.isArray(a)?a:[];
    analysisMap={};
    (Array.isArray(ua)?ua:[]).forEach(x=>{if(x.property_id&&!analysisMap[x.property_id])analysisMap[x.property_id]=x;});
    console.log("[SH] Loaded:",props.length,"properties,",Object.keys(analysisMap).length,"analyses,",alerts.length,"alerts,",watchIds.size,"watched,",deals.length,"deals");
    if(props.length>0){console.log("[SH] FIELD DUMP — first property keys:",Object.keys(props[0]).sort().join(", "));const p0=props[0];console.log("[SH] GUARD/GATED fields:",{is_gated:p0.is_gated,is_guard_gated:p0.is_guard_gated,guard_gated:p0.guard_gated,gated:p0.gated});console.log("[SH] REMARKS fields:",{showing_instructions:p0.showing_instructions?.substring(0,80),agent_remarks:p0.agent_remarks?.substring(0,80),private_remarks:p0.private_remarks?.substring(0,80),remarks:p0.remarks?.substring(0,80)});}
  }catch(e){console.error("[SH] Load error:",e);}
  document.getElementById("loading").style.display="none";
  document.getElementById("main").style.display="block";
  renderDashboard();
}

async function checkHealth(){
  const checks=[];
  checks.push({name:"Properties",ok:props.length>0,detail:`${props.length} loaded`});
  checks.push({name:"Analyses",ok:Object.keys(analysisMap).length>0,detail:`${Object.keys(analysisMap).length} found`});
  checks.push({name:"Alerts",ok:true,detail:`${alerts.length} unread`});
  checks.push({name:"Watchlist",ok:true,detail:`${watchIds.size} watching`});
  // Check if analyses table is accessible
  try{const t=await sb("underwriting_analyses?select=id&limit=1");checks.push({name:"Analysis Table",ok:Array.isArray(t),detail:Array.isArray(t)?`accessible`:"error"});}catch(e){checks.push({name:"Analysis Table",ok:false,detail:e.message});}
  // Check alerts table
  try{const t=await sb("alerts?select=id&limit=1");checks.push({name:"Alerts Table",ok:Array.isArray(t),detail:Array.isArray(t)?`accessible`:"error"});}catch(e){checks.push({name:"Alerts Table",ok:false,detail:e.message});}
  const allOk=checks.every(c=>c.ok);
  const toast=document.getElementById("alertToast");
  toast.innerHTML=`<div style="margin:8px 20px;padding:14px 16px;border-radius:14px;background:${allOk?"rgba(34,197,94,0.06)":"rgba(239,68,68,0.06)"};border:1px solid ${allOk?"rgba(34,197,94,0.15)":"rgba(239,68,68,0.15)"};animation:fadeUp .3s ease"><div style="font-size:13px;font-weight:700;color:#e2e8f0">${allOk?"✅ System Healthy":"⚠️ System Check"}</div>${checks.map(c=>`<div style="font-size:11px;margin-top:4px;color:${c.ok?"#94a3b8":"#ef4444"}">${c.ok?"✓":"✗"} ${c.name}: ${c.detail}</div>`).join("")}</div>`;
  setTimeout(()=>{toast.innerHTML="";},5000);
  console.log("[SH] Health:",checks);
}

function renderDashboard(){
  const activeProps=props.filter(p=>!isPend(p));
  const st={total:activeProps.length,hot:activeProps.filter(p=>(p.sovereign_score||0)>=60).length,watched:watchIds.size,
    reduced:activeProps.filter(p=>p.original_list_price&&p.list_price<p.original_list_price).length,
    pool:activeProps.filter(p=>p.pool).length,
    golf:activeProps.filter(p=>isGolf(p)).length,
    fresh:activeProps.filter(p=>p.days_on_market!=null&&p.days_on_market<=7).length,
    aiGo:props.filter(p=>analysisMap[p.id]&&analysisMap[p.id].verdict==="GO").length,
    aiMaybe:props.filter(p=>analysisMap[p.id]&&analysisMap[p.id].verdict==="CONDITIONAL_GO").length,
    aiNo:activeProps.filter(p=>analysisMap[p.id]&&analysisMap[p.id].verdict==="NO_GO").length,
    aiScreened:activeProps.filter(p=>!!analysisMap[p.id]).length,
    avgScore:props.length?Math.round(props.reduce((a,p)=>a+(p.sovereign_score||0),0)/props.length):0,
    avgPrice:props.length?Math.round(props.reduce((a,p)=>a+(p.list_price||0),0)/props.length):0,
    avgDom:props.length?Math.round(props.reduce((a,p)=>a+(p.days_on_market||0),0)/props.length):0};

  function sB(l,v,col,sub="",onclick="",extra=""){return`<div ${onclick?`onclick="${onclick}" style="cursor:pointer;${extra}`:`style="${extra}`}background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:8px 6px;text-align:center;transition:transform .1s" ${onclick?'onmousedown="this.style.transform=\'scale(0.97)\'" onmouseup="this.style.transform=\'scale(1)\'" ontouchstart="this.style.transform=\'scale(0.97)\'" ontouchend="this.style.transform=\'scale(1)\'"':""}><div style="font-size:8px;color:#475569;font-weight:700;letter-spacing:1px">${l}</div><div style="font-size:17px;font-weight:800;color:${col};margin-top:1px">${v}</div>${sub?`<div style="font-size:8px;color:#475569">${sub}</div>`:""}</div>`;}

  const screened=Object.keys(analysisMap).length;
  const screenedSub=`<span style="color:#22c55e;font-weight:700">${screened}</span> screened`;
  document.getElementById("statsArea").innerHTML=[sB("LISTINGS",st.total,"#e2e8f0",screenedSub),sB("AVG SCORE",st.avgScore,sc(st.avgScore)),sB("AVG PRICE",$k(st.avgPrice),"#e2e8f0"),sB("AVG DOM",st.avgDom,"#f59e0b","days")].join("");

  // Update alert badge
  const dismissed=JSON.parse(localStorage.getItem("sh_dismissed_alerts")||"[]");

  else{badge.style.display="none";}

  // Alert toast

  if(alertCount>0&&!toastDismissed){
    const priceAlerts=alerts.filter(a=>!dismissed.includes(String(a.id))&&a.alert_type==="PRICE_CHANGE").length;
    const statusAlerts=alerts.filter(a=>!dismissed.includes(String(a.id))&&a.alert_type==="STATUS_CHANGE").length;
    const newAlerts=alerts.filter(a=>!dismissed.includes(String(a.id))&&a.alert_type==="NEW_LISTING").length;
    let summary=[];
    if(newAlerts)summary.push(`${newAlerts} new listing${newAlerts>1?"s":""}`);
    if(priceAlerts)summary.push(`${priceAlerts} price drop${priceAlerts>1?"s":""}`);
    if(statusAlerts)summary.push(`${statusAlerts} status change${statusAlerts>1?"s":""}`);
    toastArea.innerHTML=`<div id="toastCard" style="margin:8px 20px;padding:14px 16px;border-radius:14px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.15);cursor:pointer;animation:fadeUp .3s ease"><div style="font-size:13px;font-weight:700;color:#e2e8f0">Hey J & Lisa 👋</div><div style="font-size:12px;color:#94a3b8;margin-top:4px">You have <span style="color:#d4af37;font-weight:700">${alertCount} alert${alertCount>1?"s":""}</span>${summary.length?" — "+summary.join(", "):""}</div><div style="font-size:11px;color:#d4af37;font-weight:700;margin-top:6px">Tap to review →</div></div>`;
    document.getElementById("toastCard").addEventListener("touchend",function(e){e.preventDefault();toastDismissed=true;localStorage.setItem("sh_toast_dismissed",new Date().toDateString());toastArea.innerHTML="";openAlerts();});
    document.getElementById("toastCard").addEventListener("click",function(){toastDismissed=true;localStorage.setItem("sh_toast_dismissed",new Date().toDateString());toastArea.innerHTML="";openAlerts();});
  } else {
    toastArea.innerHTML="";
  }

  const activeDeals=deals.filter(d=>!["closed","rejected","withdrawn","expired"].includes(d.status));
  const deadDeals=deals.filter(d=>["closed","rejected","withdrawn","expired"].includes(d.status));
  const queuedCount=activeProps.filter(p=>!analysisMap[p.id]).length;
  const fD=[["all",`All (${st.total})`],["deals",`🤝 Deals (${activeDeals.length})`],["fresh",`New (${st.fresh})`],["go",`GO (${st.aiGo})`],["maybe",`Maybe (${st.aiMaybe})`],["watched",`★ Watch (${st.watched})`],["queued",`Queued (${queuedCount})`],["reduced",`Reduced (${st.reduced})`],["golf",`Golf (${st.golf})`],["pending",`Pending (${props.filter(p=>isPend(p)).length})`]];
  document.getElementById("filtersArea").innerHTML=fD.map(([v,l])=>{
    const isDeals=v==="deals";
    const hasActive=isDeals&&activeDeals.length>0;
    const isOn=view===v;
    if(isDeals&&hasActive&&!isOn) return`<button class="filt" onclick="setView('${v}')" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.06);color:#22c55e">${l}</button>`;
    if(isDeals&&isOn) return`<button class="filt on" onclick="setView('${v}')" style="border-color:rgba(34,197,94,0.5);background:rgba(34,197,94,0.12);color:#22c55e">${l}</button>`;
    return`<button class="filt${isOn?" on":""}" onclick="setView('${v}')">${l}</button>`;
  }).join("");
  renderList();
}

function setView(v){view=v;renderDashboard();}

function togglePulse(){
  showPulse=!showPulse;
  if(!showPulse){document.getElementById("pulseArea").innerHTML="";return;}
  const zips={};
  props.forEach(p=>{const z=p.zip_code||"?";if(!zips[z])zips[z]={c:0,tp:0,tps:0,td:0,po:0,g:0,r:0};zips[z].c++;zips[z].tp+=p.list_price||0;zips[z].tps+=p.price_per_sqft||0;zips[z].td+=p.days_on_market||0;if(p.pool)zips[z].po++;if(p.is_gated)zips[z].g++;if(p.original_list_price&&p.list_price<p.original_list_price)zips[z].r++;});
  document.getElementById("pulseArea").innerHTML=`<div style="padding:16px 20px 0"><div style="font-size:10px;color:#d4af37;font-weight:700;letter-spacing:2px;margin-bottom:10px">MARKET PULSE</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">${Object.entries(zips).sort((a,b)=>b[1].c-a[1].c).map(([z,d])=>`<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px"><div style="font-size:16px;font-weight:800">${z}</div><div style="font-size:11px;color:#64748b;margin-top:4px;line-height:1.7"><span style="color:#94a3b8;font-weight:600">${d.c}</span> listings · ${$k(Math.round(d.tp/d.c))} avg<br>$${Math.round(d.tps/d.c)}/sf · ${Math.round(d.td/d.c)} DOM<br><span style="color:#3b82f6">${d.po}🏊</span> <span style="color:#22c55e">${d.g}🏘</span> <span style="color:#f59e0b">${d.r}↓</span></div></div>`).join("")}</div></div>`;
}

function renderList(){
  if(view==="deals"){renderDeals();return;}
  const q=document.getElementById("searchBox").value.toLowerCase();
  const sortBy=document.getElementById("sortBox").value;
  let list=[...props];
  list=list.filter(p=>{
    if(view==="pending"){if(!isPend(p))return false;if(q)return(p.address||"").toLowerCase().includes(q)||(p.mls_number||"").toLowerCase().includes(q)||(p.zip_code||"").includes(q);return true;}
    if(view!=="pending"&&view!=="go"&&view!=="maybe"&&isPend(p))return false;
    if(view==="watched"&&!watchIds.has(p.id))return false;
    if(view==="reduced"&&!(p.original_list_price&&p.list_price<p.original_list_price))return false;
    if(view==="golf"&&!isGolf(p))return false;
    if(view==="go"&&(!analysisMap[p.id]||analysisMap[p.id].verdict!=="GO"))return false;
    if(view==="maybe"&&(!analysisMap[p.id]||analysisMap[p.id].verdict!=="CONDITIONAL_GO"))return false;
    if(view==="queued"&&!!analysisMap[p.id])return false;
    if(view==="fresh"&&!(p.days_on_market!=null&&p.days_on_market<=7))return false;
    if(q)return(p.address||"").toLowerCase().includes(q)||(p.mls_number||"").toLowerCase().includes(q)||(p.zip_code||"").includes(q);
    return true;
  });
  list.sort((a,b)=>{
    if(sortBy==="sovereign_score")return(b.sovereign_score||0)-(a.sovereign_score||0);
    if(sortBy==="price_asc")return(a.list_price||0)-(b.list_price||0);
    if(sortBy==="price_desc")return(b.list_price||0)-(a.list_price||0);
    if(sortBy==="dom")return(b.days_on_market||0)-(a.days_on_market||0);
    if(sortBy==="ppsf")return(a.price_per_sqft||999)-(b.price_per_sqft||999);
    if(sortBy==="oldest")return(a.year_built||0)-(b.year_built||0);
    if(sortBy==="newest")return(b.year_built||0)-(a.year_built||0);
    return 0;
  });
  document.getElementById("countLabel").textContent=`${list.length} properties`;
  if(!list.length){document.getElementById("listArea").innerHTML=`<div style="text-align:center;padding:40px;color:#475569;grid-column:1/-1"><div style="font-size:32px;margin-bottom:8px">🏠</div><div style="font-size:14px;font-weight:600">No properties match</div></div>`;return;}

  document.getElementById("listArea").innerHTML=list.map((p,i)=>{
    const isW=watchIds.has(p.id),red=p.original_list_price&&p.list_price<p.original_list_price;
    const redP=red?Math.round(((p.original_list_price-p.list_price)/p.original_list_price)*100):0;
    const ai=analysisMap[p.id];
    const aiBadge=ai?(ai.verdict==="GO"?tag("✅ GO","#22c55e"):ai.verdict==="CONDITIONAL_GO"?tag("⚠️ MAYBE","#f59e0b"):tag("🚫 NO","#ef4444")):"";
    const stats=`${p.bedrooms||"?"}/${p.bathrooms||"?"} · ${p.sqft?p.sqft.toLocaleString()+"sf":"?"} · ${p.year_built||"?"} · ${p.garage_spaces||"?"}G`;
    let flags=[];
    if(checkGuardGated(p))flags.push(tag("Guard-Gated","#d4af37","🛡"));else if(p.is_gated)flags.push(tag("Gated","#22c55e","🏘"));
    const golfStatus=isGolf(p);
    if(golfStatus==="frontage")flags.push(tag("On Course","#10b981","⛳"));else if(golfStatus==="community")flags.push(tag("Golf","#10b981","⛳"));
    if(p.days_on_market!=null&&p.days_on_market<=7)flags.push(tag("NEW","#a855f7","🆕"));
    flags.push(p.pool?tag("Pool","#3b82f6","🏊"):tag("No Pool","#ef4444"));
    if(p.days_on_market>=30)flags.push(tag(`${p.days_on_market}d`,"#f59e0b"));
    if(red)flags.push(tag(`↓${redP}%`,"#22c55e"));
    const offerColor=ai?.max_offer_tier==="realistic"?"#22c55e":ai?.max_offer_tier==="aggressive"?"#f59e0b":"#ef4444";
    const aiRow=ai?`<div style="display:flex;align-items:center;gap:6px;margin-top:5px">${aiBadge}${ai.verdict!=="NO_GO"&&ai.profit_target?`<span style="font-size:10px;color:#94a3b8">Target: <span style="color:${ai.profit_target>=100000?"#22c55e":"#f59e0b"};font-weight:700">${$k(ai.profit_target)}</span></span>`:""} ${(ai.max_offer_price||ai.max_offer_raw)?`<span style="font-size:10px;color:#94a3b8">Offer: <span style="color:${offerColor};font-weight:700">${$k(ai.max_offer_price||ai.max_offer_raw)}</span></span>`:""}</div>`:"";
    const pendingBadge=isPend(p)?`<div style="margin-top:5px"><span style="font-size:10px;font-weight:800;letter-spacing:1px;color:#a855f7;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2);padding:3px 8px;border-radius:6px">${p.status==="ActiveUnderContract"?"📋 UNDER CONTRACT":"⏳ PENDING"}</span></div>`:"";
    const isPending=isPend(p);
    return`<div class="card${isW?" watched":""}" onclick="openDetail('${p.id}')" style="animation:fadeUp .3s ease ${i*30}ms both;${isPending?"opacity:0.6":""}"><div style="display:flex;gap:12px;align-items:center">${ring(p.sovereign_score)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${isW?'<span style="color:#d4af37">★ </span>':""}${esc(p.address)}</div><div style="font-size:10px;color:#64748b;margin-top:1px">${(p.subdivision_name&&truncSub(p.subdivision_name))?`<span style="color:#94a3b8">${esc(truncSub(p.subdivision_name))}</span> · `:""}${p.zip_code}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:17px;font-weight:800">${$(p.list_price)}</div>${p.price_per_sqft?`<div style="font-size:10px;color:#64748b">$${p.price_per_sqft}/sf</div>`:""}</div></div><div style="font-size:10px;color:#64748b;margin-top:4px">${stats}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${flags.join("")}</div>${aiRow}${pendingBadge}</div></div></div>`;
  }).join("");
}

const DEAL_STAGES={
  offer_drafted:{label:"Drafted",color:"#64748b",icon:"📝"},
  offer_submitted:{label:"Submitted",color:"#3b82f6",icon:"📤"},
  counter_received:{label:"Counter In",color:"#f59e0b",icon:"↩️"},
  counter_sent:{label:"Counter Out",color:"#a855f7",icon:"↪️"},
  accepted:{label:"Accepted",color:"#22c55e",icon:"🤝"},
  under_contract:{label:"Under Contract",color:"#22c55e",icon:"📋"},
  inspection:{label:"Inspection",color:"#06b6d4",icon:"🔍"},
  financing:{label:"Financing",color:"#8b5cf6",icon:"🏦"},
  closing:{label:"Closing",color:"#d4af37",icon:"🏁"},
  closed:{label:"Closed",color:"#10b981",icon:"✅"},
  rejected:{label:"Rejected",color:"#ef4444",icon:"❌"},
  withdrawn:{label:"Withdrawn",color:"#64748b",icon:"🚫"},
  expired:{label:"Expired",color:"#64748b",icon:"⏰"}
};
const DEAD_STATUSES=["closed","rejected","withdrawn","expired"];

function dealBadge(status){
  const s=DEAL_STAGES[status]||{label:status,color:"#64748b",icon:"?"};
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:0.5px;color:${s.color};background:${s.color}12;border:1px solid ${s.color}30;padding:3px 10px;border-radius:6px">${s.icon} ${s.label.toUpperCase()}</span>`;
}

function renderDeals(){
  const active=deals.filter(d=>!DEAD_STATUSES.includes(d.status));
  const dead=deals.filter(d=>DEAD_STATUSES.includes(d.status));

  if(!deals.length){
    document.getElementById("countLabel").textContent="0 deals";
    document.getElementById("listArea").innerHTML=`<div style="text-align:center;padding:60px 20px;color:#475569;grid-column:1/-1"><div style="font-size:48px;margin-bottom:12px">🤝</div><div style="font-size:16px;font-weight:700;color:#94a3b8">No Deals Yet</div><div style="font-size:13px;color:#64748b;margin-top:6px;max-width:320px;margin-left:auto;margin-right:auto">When you hit "Save & Make Offer" from the calculator, deals appear here with full pipeline tracking.</div></div>`;
    return;
  }

  document.getElementById("countLabel").textContent=`${active.length} active · ${dead.length} closed/dead`;

  let html='';

  // ── ACTIVE DEALS ──
  if(active.length){
    html+=active.map((d,i)=>{
      const tl=Array.isArray(d.timeline)?d.timeline:[];
      const lastEvent=tl.length?tl[tl.length-1]:null;
      const counters=(d.counter_count||0);
      const currentPrice=d.accepted_price||d.offer_price||0;
      const originalPrice=d.original_offer_price||d.offer_price||0;
      const priceChanged=currentPrice!==originalPrice;
      const profit=d.projected_profit_target||0;
      const daysSince=d.updated_at?Math.floor((Date.now()-new Date(d.updated_at).getTime())/(1000*60*60*24)):0;
      const stale=daysSince>3;

      return`<div class="card" onclick="openDeal('${d.id}')" style="animation:fadeUp .3s ease ${i*30}ms both;border-left:3px solid ${(DEAL_STAGES[d.status]||{}).color||'#64748b'}">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.address)}</div>
            <div style="font-size:10px;color:#64748b;margin-top:2px">${d.community?esc(d.community)+' · ':''}${d.zip_code||''} · ${d.sqft?.toLocaleString()||'?'}sf</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            ${dealBadge(d.status)}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.02)">
          <div style="text-align:center">
            <div style="font-size:8px;color:#64748b;font-weight:700">OFFER</div>
            <div style="font-size:15px;font-weight:800;color:#e2e8f0;margin-top:2px">${$k(currentPrice)}</div>
            ${priceChanged?`<div style="font-size:9px;color:#f59e0b">was ${$k(originalPrice)}</div>`:''}
          </div>
          <div style="text-align:center">
            <div style="font-size:8px;color:#64748b;font-weight:700">LIST</div>
            <div style="font-size:15px;font-weight:800;color:#94a3b8;margin-top:2px">${$k(d.list_price)}</div>
            ${d.list_price&&currentPrice?`<div style="font-size:9px;color:#22c55e">${((d.list_price-currentPrice)/d.list_price*100).toFixed(1)}% below</div>`:''}
          </div>
          <div style="text-align:center">
            <div style="font-size:8px;color:#64748b;font-weight:700">EST PROFIT</div>
            <div style="font-size:15px;font-weight:800;color:${profit>=150000?'#22c55e':profit>=75000?'#f59e0b':'#ef4444'};margin-top:2px">${$k(profit)}</div>
          </div>
        </div>

        <div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap">
          ${counters?`<span style="font-size:9px;color:#f59e0b;background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.15);padding:2px 8px;border-radius:6px;font-weight:700">${counters} counter${counters>1?'s':''}</span>`:''}
          ${d.accepted_commission_pct!=null?`<span style="font-size:9px;color:#d4af37;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.15);padding:2px 8px;border-radius:6px;font-weight:700">Lisa ${d.accepted_commission_pct}%</span>`:`<span style="font-size:9px;color:#d4af37;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.15);padding:2px 8px;border-radius:6px;font-weight:700">Lisa ${d.lisa_buy_commission_pct||0}%</span>`}
          ${d.coe_date?`<span style="font-size:9px;color:#94a3b8;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:2px 8px;border-radius:6px;font-weight:600">COE ${new Date(d.coe_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`:''}
          ${stale?`<span style="font-size:9px;color:#ef4444;font-weight:700">${daysSince}d no update</span>`:''}
        </div>

        ${lastEvent?`<div style="font-size:10px;color:#64748b;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.04)">Latest: <span style="color:#94a3b8">${esc(lastEvent.summary||lastEvent.type||'')}</span> · ${lastEvent.date?new Date(lastEvent.date).toLocaleDateString():''}</div>`:''}
      </div>`;
    }).join('');
  }

  // ── DEAD DEALS ──
  if(dead.length){
    html+=`<div style="grid-column:1/-1;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)"><div style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:2px;margin-bottom:8px">CLOSED / DEAD (${dead.length})</div></div>`;
    html+=dead.map(d=>{
      return`<div class="card" onclick="openDeal('${d.id}')" style="opacity:0.5;border-left:3px solid ${(DEAL_STAGES[d.status]||{}).color||'#64748b'}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.address)}</div>
            <div style="font-size:10px;color:#475569;margin-top:2px">${$k(d.offer_price)} offer · ${d.kill_reason?esc(d.kill_reason):'no reason logged'}</div>
          </div>
          ${dealBadge(d.status)}
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById("listArea").innerHTML=html;
}

// ═══ DEAL ACTIONS ═══
async function updateDealStatus(dealId,newStatus){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const oldStatus=d.status;
  const tl=Array.isArray(d.timeline)?[...d.timeline]:[];
  tl.push({date:new Date().toISOString(),type:'status_change',from:'system',summary:`Status: ${(DEAL_STAGES[oldStatus]||{}).label||oldStatus} → ${(DEAL_STAGES[newStatus]||{}).label||newStatus}`});

  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify({status:newStatus,timeline:tl})});
    d.status=newStatus;d.timeline=tl;
    openDeal(dealId);
    renderDashboard();
  }catch(e){console.error("Status update failed:",e);}
}

async function killDeal(dealId,status){
  const reason=prompt(`Why is this deal ${status}?`);
  if(reason===null)return;
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const tl=Array.isArray(d.timeline)?[...d.timeline]:[];
  tl.push({date:new Date().toISOString(),type:status,from:'system',summary:`Deal ${status}${reason?': '+reason:''}`});

  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify({status:status,kill_reason:reason||null,timeline:tl})});
    d.status=status;d.kill_reason=reason;d.timeline=tl;
    openDeal(dealId);
    renderDashboard();
  }catch(e){console.error("Kill deal failed:",e);}
}

async function logCounter(dealId){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const from=document.getElementById("co_from").value;
  const price=Number(document.getElementById("co_price").value)||0;
  const commission=Number(document.getElementById("co_commission").value);
  const coeDate=document.getElementById("co_coedate").value||null;
  const terms=document.getElementById("co_terms").value||'';
  const count=(d.counter_count||0)+1;

  const tl=Array.isArray(d.timeline)?[...d.timeline]:[];
  tl.push({
    date:new Date().toISOString(),
    type:from==='seller'?'counter_received':'counter_sent',
    from:from,
    summary:`CO#${count} from ${from}: ${$(price)}${commission!=null?' · '+commission+'% commission':''}`,
    price:price,
    commission_pct:commission,
    terms:terms
  });

  const newStatus=from==='seller'?'counter_received':'counter_sent';
  const patch={
    status:newStatus,
    counter_count:count,
    timeline:tl,
    offer_price:price,
    original_offer_price:d.original_offer_price||d.offer_price
  };
  if(commission!=null) patch.accepted_commission_pct=commission;
  if(coeDate) patch.coe_date=coeDate;

  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify(patch)});
    Object.assign(d,patch);
    openDeal(dealId);
    renderDashboard();
  }catch(e){console.error("Counter log failed:",e);}
}

async function addConcession(dealId){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const party=document.getElementById("conc_party").value;
  const item=document.getElementById("conc_item").value.trim();
  if(!item)return;

  const conc=Array.isArray(d.concessions)?[...d.concessions]:[];
  conc.push({party:party,item:item,detail:''});

  const tl=Array.isArray(d.timeline)?[...d.timeline]:[];
  tl.push({date:new Date().toISOString(),type:'note',from:party,summary:`Concession: ${item}`});

  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify({concessions:conc,timeline:tl})});
    d.concessions=conc;d.timeline=tl;
    openDeal(dealId);
  }catch(e){console.error("Add concession failed:",e);}
}

async function removeConcession(dealId,idx){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const conc=Array.isArray(d.concessions)?[...d.concessions]:[];
  conc.splice(idx,1);
  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify({concessions:conc})});
    d.concessions=conc;
    openDeal(dealId);
  }catch(e){console.error("Remove concession failed:",e);}
}

async function addDealNote(dealId){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const note=document.getElementById("deal_note").value.trim();
  if(!note)return;
  const tl=Array.isArray(d.timeline)?[...d.timeline]:[];
  tl.push({date:new Date().toISOString(),type:'note',from:'user',summary:note});
  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify({timeline:tl})});
    d.timeline=tl;
    openDeal(dealId);
  }catch(e){console.error("Add note failed:",e);}
}

async function saveDealField(dealId,field,value){
  const d=deals.find(x=>x.id===dealId);if(!d)return;
  const patch={};patch[field]=value||null;
  try{
    await fetch(`${SB}/rest/v1/deals?id=eq.${dealId}`,{method:'PATCH',headers:HD,body:JSON.stringify(patch)});
    d[field]=value;
  }catch(e){console.error("Save field failed:",e);}
}

// ═══ DETAIL ═══
async function openDetail(id){
  window._savedScrollY=window.scrollY;
  const p=props.find(x=>x.id===id);if(!p)return;
  const[ph,compsRaw]=await Promise.all([
    sb(`price_changes?mls_number=eq.${p.mls_number}&order=detected_at.desc`),
    sb(`sold_comps?zip_code=eq.${p.zip_code}&order=sold_date.desc&limit=200`)
  ]);
  const priceHist=Array.isArray(ph)?ph:[];
  const allComps=Array.isArray(compsRaw)?compsRaw:[];
  
  // Filter comps by similarity — prioritize same subdivision and same street
  const pSubdiv=(p.subdivision_name||p.community||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const pStreet=(p.address||'').split(/\d+\s*/)[1]||'';
  const pStreetClean=pStreet.toLowerCase().replace(/\s*(st|street|ave|avenue|dr|drive|ct|court|ln|lane|blvd|way|cir|circle|pl|place)\s*$/i,'').trim();
  const scored=allComps.map(c=>{
    let score=0;
    // Tier 1: Same subdivision (highest priority)
    const cSubdiv=(c.subdivision_name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(pSubdiv&&cSubdiv&&(cSubdiv.includes(pSubdiv)||pSubdiv.includes(cSubdiv)||cSubdiv.replace(/phase\d+/,'')===pSubdiv.replace(/phase\d+/,'')))score+=10;
    // Tier 1: Same street
    const cStreet=(c.address||'').split(/\d+\s*/)[1]||'';
    const cStreetClean=cStreet.toLowerCase().replace(/\s*(st|street|ave|avenue|dr|drive|ct|court|ln|lane|blvd|way|cir|circle|pl|place)\s*$/i,'').trim();
    if(pStreetClean&&cStreetClean&&cStreetClean===pStreetClean)score+=8;
    // Tier 2: Physical similarity
    const sqftDiff=Math.abs((c.sqft||0)-(p.sqft||0));
    if(sqftDiff<=500)score+=3;else if(sqftDiff<=800)score+=2;else if(sqftDiff<=1000)score+=1;
    if(Math.abs((c.bedrooms||0)-(p.bedrooms||0))<=1)score+=2;
    if(c.pool===p.pool)score+=1;
    if(c.is_gated===p.is_gated)score+=2;
    // Proximity scoring (nearby sales regardless of subdivision name)
    if(p.latitude&&p.longitude&&c.latitude&&c.longitude){
      const dlat=p.latitude-c.latitude,dlng=p.longitude-c.longitude;
      const miles=Math.sqrt(dlat*dlat+dlng*dlng)*69;
      if(miles<=0.25)score+=8;
      else if(miles<=0.5)score+=5;
      else if(miles<=1)score+=3;
    }
    const adj=c.sold_price||(c.list_price||0);
    const adjPpsf=c.sqft?Math.round(adj/c.sqft):0;
    return{...c,comp_score:score,adj_ppsf:adjPpsf};
  });
  // Debug: log Silver Oaks scoring
  const silverOaks=scored.find(c=>(c.address||'').toLowerCase().includes('silver oaks'));
  if(silverOaks)console.log('Silver Oaks score:',silverOaks.comp_score,'lat:',silverOaks.latitude,'lng:',silverOaks.longitude,'pLat:',p.latitude,'pLng:',p.longitude);
  const filtered=scored.filter(c=>c.comp_score>=3).sort((a,b)=>b.comp_score-a.comp_score);
  console.log('Top 10 comp scores:',filtered.slice(0,10).map(c=>c.address+': '+c.comp_score));
  const scored2=filtered.slice(0,8);
  
  // Calculate avg PPSF from comps
  const compPpsfs=scored2.filter(c=>c.adj_ppsf>0).map(c=>c.adj_ppsf);
  const avgPpsf=compPpsfs.length?Math.round(compPpsfs.reduce((a,b)=>a+b,0)/compPpsfs.length):0;
  const suggestedArv=avgPpsf&&p.sqft?$(avgPpsf*p.sqft):"—";

  const isW=watchIds.has(p.id),red=p.original_list_price&&p.list_price<p.original_list_price;
  let dtags="";
  if(checkGuardGated(p))dtags+=tag("Guard-Gated","#d4af37","🛡");else if(p.is_gated)dtags+=tag("Gated","#22c55e","🏘");
  const golfD=isGolf(p);
  if(golfD==="frontage")dtags+=tag("On Course","#10b981","⛳");

function closeDetail(){document.getElementById("detailModal").style.display="none";document.body.style.overflow="";if(typeof window._savedScrollY==="number"){window.scrollTo(0,window._savedScrollY);}}

async function watchProp(id){const p=props.find(x=>x.id===id);if(!p)return;await sb("watchlist",{method:"POST",body:JSON.stringify({property_id:p.id,price_at_watch:p.list_price,current_price:p.list_price,watch_reason:"Dashboard",status:"Watching"})});closeDetail();loadData();}
async function unwatchProp(id){const w=watchMap[id];if(w){await fetch(`${SB}/rest/v1/watchlist?id=eq.${w}`,{method:"DELETE",headers:HD});closeDetail();loadData();}}
async function saveNote(id){const input=document.getElementById("noteInput");const n=input.value.trim();if(!n)return;const p=props.find(x=>x.id===id);if(!p)return;const btn=event.target;btn.textContent="Saving...";btn.disabled=true;const ts=new Date().toLocaleDateString();const entry=ts+": "+n;const ex=p.notes?p.notes+"\n"+entry:entry;await fetch(`${SB}/rest/v1/properties?id=eq.${id}`,{method:"PATCH",headers:HD,body:JSON.stringify({notes:ex})});p.notes=ex;input.value="";btn.textContent="✓ Saved";setTimeout(()=>{btn.textContent="Save";btn.disabled=false;},800);const nc=document.getElementById("notesContainer");if(nc)nc.innerHTML=renderNotes(id,ex);}
async function deleteNote(id,idx){const p=props.find(x=>x.id===id);if(!p||!p.notes)return;const lines=p.notes.split("\n").filter(l=>l.trim());lines.splice(idx,1);const updated=lines.join("\n")||null;await fetch(`${SB}/rest/v1/properties?id=eq.${id}`,{method:"PATCH",headers:HD,body:JSON.stringify({notes:updated})});p.notes=updated;const nc=document.getElementById("notesContainer");if(nc)nc.innerHTML=renderNotes(id,updated);}
function renderNotes(id,notes){if(!notes)return"";const lines=notes.split("\n").filter(l=>l.trim());return lines.map((l,i)=>`<div style="display:flex;align-items:start;gap:8px;padding:8px 10px;margin-bottom:4px;border-radius:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04)"><div style="flex:1;font-size:12px;color:#94a3b8;line-height:1.5">${esc(l)}</div><button onclick="deleteNote('${id}',${i})" style="flex-shrink:0;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;color:#ef4444;font-size:11px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button></div>`).join("");}
function copyLisa(id){const p=props.find(x=>x.id===id);if(!p)return;const zUrl=`https://www.zillow.com/homes/${encodeURIComponent(p.address+' '+p.city+' NV '+p.zip_code)}_rb/`;const t=`Check this out:\n${p.address}, ${p.city} NV ${p.zip_code}\n${$(p.list_price)} · ${p.bedrooms}bd/${p.bathrooms}ba · ${p.sqft?.toLocaleString()}sf\nBuilt ${p.year_built} · ${p.pool?"Pool":"No Pool"}\nMLS# ${p.mls_number} · Score: ${p.sovereign_score}\n\n${zUrl}`;const smsUrl=`sms:?&body=${encodeURIComponent(t)}`;if(/iPhone|iPad|Android/i.test(navigator.userAgent)){window.location.href=smsUrl;}else if(navigator.share){navigator.share({text:t}).catch(()=>{});}else{const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("Copied!");}}

async function aiUnderwrite(id){
  const btn=document.getElementById("aiBtn_"+id);
  const resultArea=document.getElementById("aiResult_"+id);
  if(!btn||!resultArea)return;
  resultArea.style.display="";  // Restore visibility (may have been hidden by openCalcFromAi)

  // Check for existing analysis first — render immediately if found
  try{
    const existing=await sb(`underwriting_analyses?property_id=eq.${id}&status=eq.complete&order=created_at.desc&limit=1`);
    const found=Array.isArray(existing)&&existing.length>0;
    const hasProfit=found&&existing[0].profit_target!==null;
    console.log('[SH DEBUG] aiUnderwrite check:',{id,found,hasProfit,rows:existing?.length,profit:found?existing[0].profit_target:'N/A',verdict:found?existing[0].verdict:'N/A'});
    if(found&&hasProfit){
      renderAiResult(resultArea,existing[0],id);
      analysisMap[id]=existing[0];
      btn.textContent="🤖 Re-Analyze with Claude";btn.style.background="rgba(34,197,94,0.1)";btn.style.borderColor="rgba(34,197,94,0.3)";btn.style.color="#22c55e";
      return;
    }
  }catch(e){console.error("Check existing:",e);}

  // No existing — fire webhook
  if(N8N_WEBHOOK==="YOUR_WEBHOOK_URL_HERE"){
    resultArea.innerHTML=`<div style="margin-top:8px;padding:14px;border-radius:12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);text-align:center"><div style="color:#ef4444;font-size:13px;font-weight:700">⚠️ Webhook URL not configured</div><div style="color:#94a3b8;font-size:11px;margin-top:4px">Set N8N_WEBHOOK in index.html</div></div>`;
    return;
  }

  btn.textContent="🤖 Claude is analyzing...";
  btn.style.opacity="0.6";btn.style.pointerEvents="none";
  resultArea.innerHTML=`<div style="margin-top:8px;padding:20px;border-radius:12px;background:rgba(139,92,246,0.04);border:1px solid rgba(139,92,246,0.15);text-align:center"><div style="width:28px;height:28px;border:3px solid rgba(139,92,246,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div><div style="color:#a78bfa;font-size:12px;font-weight:700;margin-top:10px">Claude is running the 8-Step Protocol...</div><div style="color:#64748b;font-size:11px;margin-top:4px">This takes 60-120 seconds</div></div>`;

  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    try{
      await fetch(N8N_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({property_id:id}),signal:controller.signal});
    }catch(fetchErr){
      console.log("Webhook sent:",fetchErr.message);
    }finally{clearTimeout(timeout);}

    // Wait 90s then poll every 10s
    await new Promise(r=>setTimeout(r,90000));
    let analysis=null;
    for(let i=0;i<12;i++){
      const check=await sb(`underwriting_analyses?property_id=eq.${id}&status=eq.complete&order=created_at.desc&limit=1`);
      if(Array.isArray(check)&&check.length>0&&check[0].profit_target!==null){
        analysis=check[0];break;
      }
      await new Promise(r=>setTimeout(r,10000));
    }
    if(analysis){
      renderAiResult(resultArea,analysis,id);
      analysisMap[id]=analysis;
      btn.textContent="🤖 Re-Analyze with Claude";btn.style.opacity="1";btn.style.background="rgba(34,197,94,0.1)";btn.style.borderColor="rgba(34,197,94,0.3)";btn.style.color="#22c55e";btn.style.pointerEvents="auto";
    }else{
      resultArea.innerHTML=`<div style="margin-top:8px;padding:14px;border-radius:12px;background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);text-align:center"><div style="color:#f59e0b;font-size:13px;font-weight:700">⏳ Analysis may still be processing</div><div style="color:#94a3b8;font-size:11px;margin-top:4px">Close and reopen, then click the button again</div></div>`;
      btn.textContent="🤖 AI Underwrite — Claude Analysis";btn.style.opacity="1";btn.style.pointerEvents="auto";
    }
  }catch(e){
    console.error("AI Underwrite error:",e);
    resultArea.innerHTML=`<div style="margin-top:8px;padding:14px;border-radius:12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);text-align:center"><div style="color:#ef4444;font-size:13px;font-weight:700">❌ Analysis failed</div><div style="color:#94a3b8;font-size:11px;margin-top:4px">${esc(e.message)}</div></div>`;
    btn.textContent="🤖 AI Underwrite — Retry";btn.style.opacity="1";btn.style.pointerEvents="auto";
  }
}

function renderAiResult(area,a,id){
  const p=props.find(x=>x.id===id)||{};
  const vc=a.verdict==="GO"?"#22c55e":a.verdict==="CONDITIONAL_GO"?"#f59e0b":"#ef4444";
  const vi=a.verdict==="GO"?"✅":a.verdict==="CONDITIONAL_GO"?"⚠️":"🚫";
  const flags=typeof a.deal_flags==="string"?JSON.parse(a.deal_flags||"[]"):a.deal_flags||[];
  const lisa=typeof a.lisa_logic==="string"?JSON.parse(a.lisa_logic||"{}"):a.lisa_logic||{};

  const lisaChecks=Object.entries(lisa).map(([k,v])=>{
    const label=k.replace(/_/g," ").replace(/pass$/,"").toUpperCase().trim();

async function openCalcFromAi(id){
  const resultArea=document.getElementById("aiResult_"+id);
  if(resultArea)resultArea.style.display="none";
  // Fetch AI analysis and pre-fill calculator with its values
  try{
    const res=await sb(`underwriting_analyses?property_id=eq.${id}&status=eq.complete&order=created_at.desc&limit=1`);
    if(Array.isArray(res)&&res.length>0){
      const a=res[0];
      calcProp=props.find(x=>x.id===id);if(!calcProp)return;
      const ch=await sb(`calc_history?mls_number=eq.${calcProp.mls_number}&order=created_at.desc`);
      calcHistory=Array.isArray(ch)?ch:[];
      // Map underwriting_analyses fields to calc format
      const aiSaved={
        purchase_price:a.max_offer_price||a.max_offer_raw||a.purchase_price||a.list_price||calcProp.list_price,
        arv:a.arv_target||a.arv||0,
        rehab_budget:a.reno_total||0,
        additional_costs:0,
        ltv:a.ltv_pct||90,
        interest_rate:a.interest_rate||11.49,
        points:0,
        origination:a.origination_pct||1.5,
        closing_buy_flat:5000,
        reno_draw_pct:100,
        hold_months:8,
        tax_annual:a.tax_annual||Math.round((a.purchase_price||calcProp.list_price||900000)*0.007),
        insurance_monthly:Math.round(((a.purchase_price||0)+(a.reno_total||0))*0.0035/12),
        hoa_monthly:a.hoa_monthly||calcProp.hoa_monthly||450,
        utilities_monthly:650,
        buyer_agent_pct:2.5,
        closing_sell_flat:3500,
        staging:5000,
        title_insurance:3000,
        hoa_transfer:500,
        misc_buffer:1500,
        service_fee:1499,
        lisa_commission_pct:2.5,
        created_at:a.created_at
      };
      renderCalc(aiSaved);
      document.getElementById("calcModal").style.display="block";
      document.body.style.overflow="hidden";
      return;
    }
  }catch(e){console.error("AI pre-fill error:",e);}
  // Fallback to normal calc open
  openCalc(id);
}

async function shareAiAnalysis(id){
  const p=props.find(x=>x.id===id);if(!p)return;
  try{
    const res=await sb(`underwriting_analyses?property_id=eq.${id}&order=created_at.desc&limit=1`);
    if(!Array.isArray(res)||!res.length)return;
    const a=res[0];
    const tierTxt=a.max_offer_tier==="realistic"?"Realistic":a.max_offer_tier==="aggressive"?"Aggressive":a.max_offer_tier==="long_shot"?"Long shot":"";
    const txt=`🤖 SOVEREIGN HOUSE AI ANALYSIS\n\n${p.address}, ${p.city} NV ${p.zip_code}\n${$(p.list_price)} · ${p.bedrooms}bd/${p.bathrooms}ba · ${p.sqft?.toLocaleString()}sf\n\nVERDICT: ${a.verdict?.replace(/_/g," ")}\n${a.ai_narrative||""}\n\nARV: ${$(a.arv)} ($${a.arv_ppsf}/sf)\nReno: ${$(a.reno_total)} (${a.reno_tier?.replace(/_/g," ")})\nMax Offer: ${$(a.max_offer_price||a.max_offer_raw)}${a.max_offer_flag?" ("+a.max_offer_flag+")":""}${tierTxt?" — "+tierTxt:""}\n\nProfit (Target/8mo): ${$(a.profit_target)} · ${a.roi_target?.toFixed(1)}% ROI\nProfit (Conservative/10mo): ${$(a.profit_conservative)} · ${a.roi_conservative?.toFixed(1)}% ROI`;
    if(navigator.share){await navigator.share({text:txt}).catch(()=>{});}
    else{await navigator.clipboard.writeText(txt);alert("Analysis copied!");}
  }catch(e){console.error(e);}
}

        <span id="holdLabel" style="font-size:14px;font-weight:800;color:#d4af37;min-width:70px;text-align:right">${v.hold} months</span>
      </div>
      <div class="row2" style="margin-top:6px">
        <div class="fld"><label>PROPERTY TAX (annual)</label><input id="c_tax" type="number" class="cinput" value="${v.tax}" oninput="updateCalc()"/><div class="sub">~0.7% of value</div></div>
        <div class="fld"><label>INSURANCE $/mo</label><input id="c_ins" type="number" class="cinput" value="${v.ins}" oninput="updateCalc()"/><div class="sub">(Purchase+Reno)×0.35%/12</div></div>
      </div>
      <div class="row2">
        <div class="fld"><label>HOA $/mo</label><input id="c_hoa" type="number" class="cinput" value="${v.hoa}" oninput="updateCalc()"/></div>
        <div class="fld"><label>UTILITIES/POOL/LANDSCAPE $/mo</label><input id="c_util" type="number" class="cinput" value="${v.util}" oninput="updateCalc()"/></div>
      </div>
      <div id="holdSummary" style="margin-bottom:10px"></div>
    </div>

    <!-- SELLING COSTS -->
    <div class="sec-toggle" onclick="toggleSec('selling')">
      <div style="font-size:10px;color:#d4af37;font-weight:700;letter-spacing:2px">SELLING COSTS</div>
      <span style="color:#64748b;font-size:14px" id="sell_arrow">${calcSections.selling?"▼":"▶"}</span>
    </div>
    <div id="sec_selling" style="display:${calcSections.selling?"block":"none"}">
      <div style="padding:8px 12px;border-radius:8px;background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.12);font-size:11px;color:#22c55e;margin:10px 0">Lisa lists every deal — $0 listing commission</div>
      <div style="margin-bottom:12px;padding:12px;border-radius:10px;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.15)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <label style="font-size:10px;color:#d4af37;font-weight:700;letter-spacing:1px">LISA BUY-SIDE COMMISSION</label>
          <span id="lisaCommLabel" style="font-size:14px;font-weight:800;color:#d4af37">${v.lisacomm}%</span>
        </div>
        <input id="c_lisacomm" type="range" min="0" max="3" step="0.5" value="${v.lisacomm}" oninput="document.getElementById('lisaCommLabel').textContent=this.value+'%';updateCalc()" style="width:100%;accent-color:#d4af37"/>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:#475569;margin-top:4px"><span>0%</span><span>1%</span><span>2%</span><span>2.5%</span><span>3%</span></div>
        <div id="lisaCommAmt" style="text-align:center;font-size:12px;color:#22c55e;font-weight:700;margin-top:6px"></div>
        <div style="font-size:9px;color:#64748b;text-align:center;margin-top:2px">Income credit — reduces total project cost</div>
      </div>
      <div class="row3">
        <div class="fld"><label>BUYER AGENT %</label><input id="c_bagent" type="number" class="cinput" value="${v.bagent}" oninput="updateCalc()"/></div>
        <div class="fld"><label>CLOSING (SELL) $</label><input id="c_closesell" type="number" class="cinput" value="${v.closesell}" oninput="updateCalc()"/></div>
        <div class="fld"><label>STAGING $</label><input id="c_staging" type="number" class="cinput" value="${v.staging}" oninput="updateCalc()"/></div>
      </div>
      <div class="row3">
        <div class="fld"><label>TITLE INSURANCE $</label><input id="c_title" type="number" class="cinput" value="${v.title}" oninput="updateCalc()"/></div>
        <div class="fld"><label>HOA TRANSFER $</label><input id="c_hoaxfer" type="number" class="cinput" value="${v.hoaxfer}" oninput="updateCalc()"/></div>
        <div class="fld"><label>MISC BUFFER $</label><input id="c_misc" type="number" class="cinput" value="${v.misc}" oninput="updateCalc()"/></div>
      </div>
      <div id="sellSummary" style="margin-bottom:10px"></div>
    </div>

    <!-- RESULTS -->
    <div id="calcResults" style="margin-top:16px"></div>

    <button id="calcSaveBtn" onclick="doSaveCalc()" class="btn" style="width:100%;margin-top:12px;padding:14px;font-size:14px;background:rgba(212,175,55,0.9);color:#0a0a0a">💾 Save Analysis</button>
    <button onclick="saveAndOffer()" class="btn" style="width:100%;margin-top:8px;padding:14px;font-size:14px;background:linear-gradient(135deg,rgba(34,197,94,0.9),rgba(34,197,94,0.7));color:#0a0a0a;font-weight:800">📝 Save & Make Offer →</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button onclick="exportPDF()" class="btn" style="flex:1;padding:12px;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#f1f5f9">📄 Export PDF</button>
      <button onclick="shareAnalysis()" class="btn" style="flex:1;padding:12px;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#f1f5f9">📤 Share</button>
    </div>
  </div>`;
  updateCalc();
}

function toggleSec(name){
  calcSections[name]=!calcSections[name];
  const el=document.getElementById("sec_"+name);
  el.style.display=calcSections[name]?"block":"none";
  const arrows={financing:"fin_arrow",holding:"hold_arrow",selling:"sell_arrow"};
  document.getElementById(arrows[name]).textContent=calcSections[name]?"▼":"▶";
}

function applyTier(){
  const tier=document.getElementById("c_tier").value;
  const sqft=calcProp?.sqft||2500;
  const rates={lite:25,standard:50,full:75,structural:100,gut:130};
  if(rates[tier]){document.getElementById("c_rehab").value=Math.round(sqft*rates[tier]);updateCalc();}
}

function updateCalc(){
  if(!calcProp)return;
  const p=calcProp,sqft=p.sqft||2500;
  const arv=gv("c_arv"),pur=gv("c_pur"),rehab=gv("c_rehab"),addl=gv("c_addl");
  const ltv=gv("c_ltv"),rate=gv("c_rate"),pts=gv("c_pts"),orig=gv("c_orig"),closeBuy=gv("c_closebuy"),drawPct=gv("c_drawpct"),svcfee=gv("c_svcfee");
  const holdMo=gv("c_hold"),taxAnn=gv("c_tax"),ins=gv("c_ins"),hoa=gv("c_hoa"),util=gv("c_util");
  const bagent=gv("c_bagent"),closeSell=gv("c_closesell"),staging=gv("c_staging"),title=gv("c_title"),hoaxfer=gv("c_hoaxfer"),misc=gv("c_misc");
  const lisaCommPct=parseFloat(document.getElementById("c_lisacomm")?.value||2.5);
  const lisaCommAmt=Math.round(pur*(lisaCommPct/100));
  const el_lca=document.getElementById("lisaCommAmt");if(el_lca)el_lca.textContent=lisaCommPct>0?'-'+$(lisaCommAmt)+' credit':'No commission';
  const totalReno=rehab+addl;

  // Discount from list
  const discount=p.list_price>0?((p.list_price-pur)/p.list_price*100).toFixed(1):0;
  document.getElementById("discountLabel").textContent=pur<p.list_price?`${discount}% below ask`:(pur>p.list_price?`${Math.abs(discount)}% above ask`:"At list");
  document.getElementById("discountLabel").style.color=pur<=p.list_price?"#22c55e":"#ef4444";

  // ARV PPSF
  document.getElementById("arvPPSF").textContent=sqft>0?`$${Math.round(arv/sqft)}/sf`:"—";
  document.getElementById("rehabPPSF").textContent=sqft>0?`$${Math.round(totalReno/sqft)}/sf`:"";

  // FINANCING
  const loanAmt=Math.round(pur*(ltv/100));
  const renoFinanced=Math.round(totalReno*(drawPct/100));
  const totalLoan=loanAmt+renoFinanced;
  const loanPts=Math.round(totalLoan*(pts/100));
  const loanOrig=Math.round(totalLoan*(orig/100));
  const buyClosing=closeBuy;
  const totalLoanFees=loanPts+loanOrig+buyClosing+svcfee;
  const downPayment=pur-loanAmt;

  document.getElementById("finSummary").innerHTML=`
    <div class="wb"><div class="wl">LOAN AMOUNT</div><div class="wv" style="color:#e2e8f0">${$(totalLoan)}</div></div>
    <div class="wb"><div class="wl">DOWN PAYMENT</div><div class="wv" style="color:#f59e0b">${$(downPayment)}</div></div>
    <div class="wb"><div class="wl">TOTAL LOAN FEES</div><div class="wv" style="color:#f59e0b">${$(totalLoanFees)}</div><div class="sub" style="font-size:9px;color:#475569;margin-top:2px">${$(loanPts)} pts + ${$(loanOrig)} orig + ${$(buyClosing)} close + ${$(svcfee)} svc</div></div>`;

  // HOLDING
  const monthlyInterest=Math.round(totalLoan*(rate/100)/12);
  const monthlyTax=Math.round(taxAnn/12);
  const monthlyTotal=monthlyInterest+monthlyTax+ins+hoa+util;
  const totalHold=monthlyTotal*holdMo;

  document.getElementById("holdSummary").innerHTML=`
    <div style="padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);margin-top:8px">
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Interest (${rate}% on ${$(totalLoan)})</span><span style="font-weight:700">${$(monthlyInterest)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Property Tax</span><span style="font-weight:700">${$(monthlyTax)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Insurance</span><span style="font-weight:700">${$(ins)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">HOA</span><span style="font-weight:700">${$(hoa)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Utilities/Pool/Landscape</span><span style="font-weight:700">${$(util)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px"><span style="color:#d4af37;font-weight:800">MONTHLY TOTAL</span><span style="font-weight:800;color:#d4af37">${$(monthlyTotal)}/mo</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0 0;font-size:13px"><span style="color:#f59e0b;font-weight:700">× ${holdMo} MONTHS</span><span style="font-weight:800;color:#f59e0b">${$(totalHold)}</span></div>
    </div>`;

  // SELLING
  const buyerComm=Math.round(arv*(bagent/100));
  const sellClosing=closeSell;
  const rptt=arv>0?Math.ceil(arv/500)*2.55:0;
  const totalSell=buyerComm+sellClosing+staging+title+hoaxfer+misc+rptt;

  document.getElementById("sellSummary").innerHTML=`
    <div style="padding:12px;border-radius:10px;background:rgba(255,255,255,0.02);margin-top:8px">
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Buyer Agent (${bagent}%)</span><span style="font-weight:700">${$(buyerComm)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Closing (Sell)</span><span style="font-weight:700">${$(sellClosing)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Staging</span><span style="font-weight:700">${$(staging)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Title Insurance</span><span style="font-weight:700">${$(title)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">HOA Transfer</span><span style="font-weight:700">${$(hoaxfer)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Misc Buffer</span><span style="font-weight:700">${$(misc)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:#94a3b8">Transfer Tax (RPTT)</span><span style="font-weight:700">${$(Math.round(rptt))}</span></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px"><span style="color:#d4af37;font-weight:800">TOTAL SELL COSTS</span><span style="font-weight:800;color:#d4af37">${$(totalSell)}</span></div>
    </div>`;

  // PROFIT WATERFALL
  const totalCost=pur+totalReno+totalLoanFees+totalHold+totalSell-lisaCommAmt;
  const profit=arv-totalCost;
  const roi=totalCost>0?((profit/totalCost)*100).toFixed(1):"0";
  const cashIn=downPayment+totalReno*(1-drawPct/100)+totalLoanFees;
  const cashROI=cashIn>0?((profit/cashIn)*100).toFixed(1):"0";
  const pc=profit>0?"#22c55e":"#ef4444";

  document.getElementById("calcResults").innerHTML=`
    <div style="font-size:10px;color:#d4af37;font-weight:700;letter-spacing:2px;margin-bottom:10px">PROFIT WATERFALL</div>
    <div style="padding:14px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06)">
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#22c55e;font-weight:600">ARV (Sale Price)</span><span style="font-weight:800;color:#22c55e">${$(arv)}${sqft>0?` <span style="font-size:10px;font-weight:600;color:#94a3b8">$${Math.round(arv/sqft)}/sf</span>`:""}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">− Purchase Price</span><span style="color:#f1f5f9;font-weight:600">${$(pur)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">− Renovation (${$(rehab)} + ${$(addl)})</span><span style="color:#f1f5f9;font-weight:600">${$(totalReno)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">− Loan Fees (${$(loanOrig)} orig + ${$(svcfee)} svc + ${$(buyClosing)} close)</span><span style="color:#f1f5f9;font-weight:600">${$(totalLoanFees)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">− Holding (${holdMo} months)</span><span style="color:#f1f5f9;font-weight:600">${$(totalHold)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.06)"><span style="color:#94a3b8">− Selling Costs</span><span style="color:#f1f5f9;font-weight:600">${$(totalSell)}</span></div>
      ${lisaCommAmt>0?`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.06)"><span style="color:#22c55e;font-weight:600">+ Lisa Buy Commission (${lisaCommPct}%)</span><span style="font-weight:700;color:#22c55e">−${$(lisaCommAmt)}</span></div>`:""}
      <div style="display:flex;justify-content:space-between;padding:8px 0 4px;font-size:15px"><span style="font-weight:800;color:${pc}">NET PROFIT</span><span style="font-weight:800;color:${pc};font-size:22px">${$(profit)}</span></div>
      <div style="display:flex;gap:12px;margin-top:4px">
        <span style="font-size:11px;color:${pc};font-weight:700">${roi}% Total ROI</span>
        <span style="font-size:11px;color:#d4af37;font-weight:700">${cashROI}% Cash-on-Cash</span>
      </div>
    </div>

    <div style="margin-top:12px;padding:14px;border-radius:14px;background:rgba(212,175,55,0.06);border:1px solid rgba(212,175,55,0.2)">
      <div style="font-size:9px;color:#d4af37;font-weight:700;letter-spacing:2px">DEAL SCREENING</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
        <div style="text-align:center;padding:10px;border-radius:10px;background:rgba(0,0,0,0.2)">
          <div style="font-size:9px;color:#64748b;font-weight:700;letter-spacing:1px">PROFIT MARGIN</div>
          <div style="font-size:20px;font-weight:800;color:${arv>0?(profit/arv*100>=12?'#22c55e':profit/arv*100>=8?'#f59e0b':'#ef4444'):'#64748b'};margin-top:2px">${arv>0?(profit/arv*100).toFixed(1):'0'}%</div>
          <div style="font-size:9px;color:#475569;margin-top:2px">of ARV</div>
        </div>
        <div style="text-align:center;padding:10px;border-radius:10px;background:rgba(0,0,0,0.2)">
          <div style="font-size:9px;color:#64748b;font-weight:700;letter-spacing:1px">ALL-IN / ARV</div>
          <div style="font-size:20px;font-weight:800;color:${arv>0?(totalCost/arv*100<=85?'#22c55e':totalCost/arv*100<=90?'#f59e0b':'#ef4444'):'#64748b'};margin-top:2px">${arv>0?(totalCost/arv*100).toFixed(1):'0'}%</div>
          <div style="font-size:9px;color:#475569;margin-top:2px">sweet spot ≤88%</div>
        </div>
        <div style="text-align:center;padding:10px;border-radius:10px;background:rgba(0,0,0,0.2)">
          <div style="font-size:9px;color:#64748b;font-weight:700;letter-spacing:1px">CASH-ON-CASH</div>
          <div style="font-size:20px;font-weight:800;color:${cashIn>0?(profit/cashIn*100>=50?'#22c55e':profit/cashIn*100>=25?'#f59e0b':'#ef4444'):'#64748b'};margin-top:2px">${cashROI}%</div>
          <div style="font-size:9px;color:#475569;margin-top:2px">ROI on your cash</div>
        </div>
      </div>
      <div style="margin-top:10px;padding:10px;border-radius:8px;background:rgba(0,0,0,0.2);font-size:11px;text-align:center;font-weight:700;color:${arv>0?(profit/arv*100>=12?'#22c55e':profit/arv*100>=8?'#f59e0b':'#ef4444'):'#64748b'}">${arv>0?(profit/arv*100>=12?'✅ DEAL SCREENS — 12%+ margin on ARV':profit/arv*100>=8?'⚠️ MARGINAL — 8-12% margin, negotiate harder':'🚫 DOES NOT SCREEN — under 8% margin'):'Enter ARV to screen'}</div>
    </div>

    <div style="margin-top:12px;padding:16px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08)">
      <div style="font-size:9px;color:#94a3b8;font-weight:700;letter-spacing:2px;margin-bottom:10px">PROJECT SUMMARY</div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">Purchase</span><span style="color:#e2e8f0;font-weight:600">${$(pur)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">Renovation</span><span style="color:#e2e8f0;font-weight:600">${$(totalReno)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">Loan Fees (${$(loanOrig)} orig + ${$(svcfee)} svc + ${$(buyClosing)} close)</span><span style="color:#e2e8f0;font-weight:600">${$(totalLoanFees)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04)"><span style="color:#94a3b8">Holding (${holdMo}mo)</span><span style="color:#e2e8f0;font-weight:600">${$(totalHold)}</span></div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.06)"><span style="color:#94a3b8">Selling</span><span style="color:#e2e8f0;font-weight:600">${$(totalSell)}</span></div>
      ${lisaCommAmt>0?`<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.06)"><span style="color:#22c55e">Lisa Buy Commission (${lisaCommPct}%)</span><span style="color:#22c55e;font-weight:600">−${$(lisaCommAmt)}</span></div>`:""}
      <div style="display:flex;justify-content:space-between;padding:8px 0 2px;font-size:15px"><span style="font-weight:800;color:#f1f5f9">TOTAL PROJECT COST</span><span style="font-weight:800;color:#f1f5f9;font-size:20px">${$(totalCost)}</span></div>
    </div>
