<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#e8e8e8; font-family:'DM Sans',system-ui,sans-serif; }
.header { padding:20px 24px; border-bottom:1px solid #1a1a1a; display:flex; align-items:center; justify-content:space-between; background:linear-gradient(180deg,#111,#0a0a0a); }
.brand { font-size:11px; color:#e0c97f; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
.title { font-size:20px; font-weight:700; color:#fff; }
.container { max-width:840px; margin:0 auto; padding:16px 16px 100px; }
.section { margin-bottom:2px; border:1px solid #2a2a2a; border-radius:6px; overflow:hidden; background:#111; }
.section-header { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#141414; border:none; cursor:pointer; color:#e0c97f; font-size:14px; font-weight:600; font-family:'DM Sans',sans-serif; letter-spacing:.3px; }
.section-header:hover { background:#1a1a1a; }
.section-header .num { color:#5a5a5a; margin-right:10px; font-size:12px; }
.section-header .arrow { font-size:18px; transition:transform .2s; }
.section-header.open .arrow { transform:rotate(180deg); }
.section-body { padding:16px 18px 20px; border-top:1px solid #222; }
.row { display:flex; flex-wrap:wrap; gap:0; align-items:flex-end; }
.field { display:inline-flex; flex-direction:column; margin-right:16px; margin-bottom:12px; }
.field label { font-size:10px; color:#777; text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px; font-family:'DM Sans',sans-serif; }
input, select, textarea { background:#1a1a1a; border:1px solid #333; border-radius:4px; color:#e8e8e8; padding:8px 10px; font-size:13px; font-family:'DM Mono',monospace; outline:none; width:100%; }
input:focus, select:focus, textarea:focus { border-color:#e0c97f; }
select { cursor:pointer; }
textarea { resize:vertical; line-height:1.5; }
.price-input { font-size:16px!important; font-weight:600; color:#e0c97f!important; }
.date-input { color:#e0c97f!important; }
.toggle { display:inline-flex; align-items:center; gap:8px; cursor:pointer; margin-right:20px; margin-bottom:12px; font-size:13px; }
.toggle-track { width:36px; height:20px; border-radius:10px; position:relative; transition:background .2s; cursor:pointer; }
.toggle-track.on { background:#e0c97f; }
.toggle-track.off { background:#333; }
.toggle-thumb { width:16px; height:16px; border-radius:8px; position:absolute; top:2px; transition:left .2s,background .2s; }
.toggle-track.on .toggle-thumb { left:18px; background:#111; }
.toggle-track.off .toggle-thumb { left:2px; background:#666; }
.insp-row { display:flex; align-items:center; justify-content:space-between; padding:4px 0; border-bottom:1px solid #1a1a1a; }
.insp-row span { font-size:12px; color:#bbb; flex:1; }
.insp-row select { width:90px; padding:4px 6px; font-size:11px; }
.btn { padding:8px 20px; border-radius:4px; border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:'DM Sans',sans-serif; letter-spacing:.3px; }
.btn-primary { background:#e0c97f; color:#111; }
.btn-primary:hover { background:#d4b85f; }
.btn-primary:disabled { background:#333; color:#666; cursor:not-allowed; }
.btn-outline { background:transparent; border:1px solid #333; color:#888; padding:8px 16px; font-size:12px; font-weight:600; }
.btn-outline:hover { border-color:#e0c97f; color:#e0c97f; }
.footer { position:fixed; bottom:0; left:0; right:0; padding:10px 24px; background:#111; border-top:1px solid #2a2a2a; display:flex; justify-content:center; gap:32px; font-size:12px; font-family:'DM Mono',monospace; z-index:100; }
.footer span { color:#777; }
.footer .val { color:#ccc; }
.footer .val.empty { color:#444; }
.footer .val.gold { color:#e0c97f; }
.note { font-size:11px; color:#555; font-style:italic; margin-bottom:10px; }
.validation { padding:10px 16px; margin-bottom:12px; border-radius:4px; background:#1a1200; border:1px solid #3a2a00; font-size:12px; color:#e0c97f; }
.preview-frame { width:100%; height:calc(100vh - 160px); border:1px solid #2a2a2a; border-radius:6px; background:#222; }
.success-bar { padding:12px 16px; background:#0d1a0d; border:1px solid #1a3a1a; border-radius:4px; font-size:13px; color:#7fbf7f; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
.insp-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 20px; }
@media(max-width:600px){ .insp-grid { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; gap:0; } .insp-grid > div { min-width:85%; flex-shrink:0; scroll-snap-align:start; padding-right:16px; } }
.hidden { display:none; }
</style>

function dollars(n) { return (n !== null && n !== undefined && n !== "" && !isNaN(n)) ? n.toLocaleString('en-US') : ""; }

function numberToWords(n) {
  if (!n) return "";
  n = Math.floor(n);
  if (n === 0) return "Zero";
  const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
    "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tensW = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  let parts = [];
  if (n >= 1000000) { parts.push(ones[Math.floor(n/1000000)] + " Million"); n %= 1000000; }
  if (n >= 1000) {
    let t = Math.floor(n/1000);
    if (t >= 100) { parts.push(ones[Math.floor(t/100)] + " Hundred"); t %= 100; }
    if (t >= 20) { parts.push(tensW[Math.floor(t/10)]); if (t%10) parts.push(ones[t%10]); }
    else if (t > 0) parts.push(ones[t]);
    parts.push("Thousand"); n %= 1000;
  }
  if (n >= 100) { parts.push(ones[Math.floor(n/100)] + " Hundred"); n %= 100; }
  if (n >= 20) { parts.push(tensW[Math.floor(n/10)]); if (n%10) parts.push(ones[n%10]); }
  else if (n > 0) parts.push(ones[n]);
  return parts.join(" ");
}

// PDF FILL ENGINE — Raw incremental update (no pdf-lib for serialization)
// ══════════════════════════════════════════════════════════════════════════════
function getRawTemplate() {
  const binaryStr = atob(BLANK_RPA_B64);
  const pdfBytes = new Uint8Array(binaryStr.length);
  for (let i = 0; i < binaryStr.length; i++) pdfBytes[i] = binaryStr.charCodeAt(i);
  return pdfBytes;
}

// Scan raw PDF text for all objects (skipping stream data)
function scanPdfObjects(rawStr) {
  const objs = {};
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while ((m = re.exec(rawStr)) !== null) {
    const objNum = parseInt(m[1]), genNum = parseInt(m[2]);
    const bodyStart = m.index + m[0].length;
    // Find endobj, but skip past any stream content
    let endPos;
    const streamIdx = rawStr.indexOf('stream', bodyStart);
    const endobjIdx = rawStr.indexOf('endobj', bodyStart);
    if (endobjIdx < 0) continue;
    if (streamIdx >= 0 && streamIdx < endobjIdx) {
      const endstreamIdx = rawStr.indexOf('endstream', streamIdx + 6);
      endPos = endstreamIdx >= 0 ? rawStr.indexOf('endobj', endstreamIdx) : endobjIdx;
    } else {
      endPos = endobjIdx;
    }
    if (endPos < 0) continue;
    objs[objNum] = { genNum, body: rawStr.substring(bodyStart, endPos).trim() };
    re.lastIndex = endPos + 6;
  }
  return objs;
}

    step = "DECODE";
    const dealData = buildDealData(formState);

    const rawStr = new TextDecoder('latin1').decode(raw);

    step = "SCAN";
    // Parse raw PDF — no pdf-lib at all
    const objs = scanPdfObjects(rawStr);
    const objNums = Object.keys(objs).map(Number);

    // Find page objects: /Type /Page but NOT /Type /Pages
    const pageObjs = [];
    for (const n of objNums) {
      const b = objs[n].body;
      if (b.match(/\/Type\s*\/Page\b/) && !b.match(/\/Type\s*\/Pages\b/)) {
        pageObjs.push({ objNum: n, genNum: objs[n].genNum, body: b });
      }
    }
    pageObjs.sort((a, b) => a.objNum - b.objNum);

    step = "MAP";
    const byPage = {};
    for (const [pg, x, yTop, key, fontSize, maxChars] of FIELD_MAP) {
      if (!byPage[pg]) byPage[pg] = [];
      const val = (dealData[key] || "").toString().substring(0, maxChars);
      if (val) byPage[pg].push({ x, y: PAGE_H - yTop, text: val, size: fontSize });
    }
    console.log("[RPA] Fields per page:", Object.fromEntries(Object.entries(byPage).map(([k,v])=>[k,v.length])));

    step = "TRAILER";
    const tail = rawStr.slice(-2000);
    const xrefMatch = tail.match(/startxref\s+(\d+)/);
    const prevXref = xrefMatch ? parseInt(xrefMatch[1]) : 0;
    const rootMatch = tail.match(/\/Root\s+(\d+)\s+(\d+)\s+R/);
    const rootObjNum = rootMatch ? parseInt(rootMatch[1]) : 0;
    const rootGenNum = rootMatch ? parseInt(rootMatch[2]) : 0;
    const sizeMatch = tail.match(/\/Size\s+(\d+)/);
    let maxObj = sizeMatch ? parseInt(sizeMatch[1]) : 0;
    for (const n of Object.keys(objs).map(Number)) { if (n >= maxObj) maxObj = n + 1; }

    step = "BUILD";
    let nextObj = maxObj;
    const fontObjNum = nextObj++;

    // Content streams per page
    const streams = {};
    for (const [pgStr, fields] of Object.entries(byPage)) {
      const pgIdx = parseInt(pgStr) - 1;
      if (pgIdx < 0 || pgIdx >= pageObjs.length || fields.length === 0) continue;
      let sc = 'q\n';
      for (const f of fields) {
        const t = f.text.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        sc += 'BT /F_SH ' + f.size + ' Tf 1 0 0 1 ' + f.x + ' ' + f.y + ' Tm (' + t + ') Tj ET\n';
      }
      sc += 'Q\n';
      streams[pgIdx] = { objNum: nextObj++, content: sc };
    }

    step = "MODIFY";
    // Modify page dict TEXT to add our content stream + font
    const modifiedPageStrs = {}; // objNum -> modified body string
    const modifiedFontDicts = {}; // objNum -> modified body string (for ref'd Font dicts)
    const modifiedResDicts = {}; // objNum -> modified body string (for ref'd Resources dicts)
    const fontRefStr = fontObjNum + ' 0 R';

    for (const [pgIdxStr, stream] of Object.entries(streams)) {
      const pgIdx = parseInt(pgIdxStr);
      const page = pageObjs[pgIdx];
      let body = page.body;
      const csRefStr = stream.objNum + ' 0 R';

      // --- Modify /Contents to include our content stream ---
      const cArr = body.match(/\/Contents\s*\[([^\]]*)\]/);
      const cSingle = body.match(/\/Contents\s+(\d+\s+\d+\s+R)/);
      if (cArr) {
        body = body.replace(/\/Contents\s*\[([^\]]*)\]/, '/Contents [$1 ' + csRefStr + ']');
      } else if (cSingle) {
        body = body.replace(/\/Contents\s+(\d+\s+\d+\s+R)/, '/Contents [$1 ' + csRefStr + ']');
      } else {
        // No Contents — add one
        body = body.replace(/>>(\s*)$/, '/Contents ' + csRefStr + ' >>$1');
      }

      // --- Add /F_SH to font resources ---
      // Check if Resources is inline or a ref
      const resRefM = body.match(/\/Resources\s+(\d+)\s+(\d+)\s+R/);
      if (resRefM) {
        // Resources is a ref — modify that object
        const resObjNum = parseInt(resRefM[1]);
        const resObj = objs[resObjNum];
        if (resObj && !modifiedResDicts[resObjNum]) {
          let resBody = resObj.body;
          const fontRefInRes = resBody.match(/\/Font\s+(\d+)\s+(\d+)\s+R/);
          const fontInlineInRes = resBody.match(/\/Font\s*<</);
          if (fontRefInRes) {
            // Font is also a ref — modify that object
            const fObjNum = parseInt(fontRefInRes[1]);
            const fObj = objs[fObjNum];
            if (fObj && !modifiedFontDicts[fObjNum]) {
              let fBody = fObj.body;
              fBody = fBody.replace(/<</, '<< /F_SH ' + fontRefStr);
              modifiedFontDicts[fObjNum] = { genNum: fObj.genNum, body: fBody };
            }
          } else if (fontInlineInRes) {
            resBody = resBody.replace(/\/Font\s*<</, '/Font << /F_SH ' + fontRefStr);
            modifiedResDicts[resObjNum] = { genNum: resObj.genNum, body: resBody };
          } else {
            // No Font dict in Resources — add one
            resBody = resBody.replace(/<</, '<< /Font << /F_SH ' + fontRefStr + ' >>');
            modifiedResDicts[resObjNum] = { genNum: resObj.genNum, body: resBody };
          }
        }
      } else if (body.match(/\/Font\s*<</)) {
        // Inline Font dict in inline Resources
        body = body.replace(/\/Font\s*<</, '/Font << /F_SH ' + fontRefStr);
      } else if (body.match(/\/Resources\s*<</)) {
        // Inline Resources but no Font dict — add Font dict
        body = body.replace(/\/Resources\s*<</, '/Resources << /Font << /F_SH ' + fontRefStr + ' >>');
      } else {
        // No Resources at all — add inline Resources with Font
        body = body.replace(/>>(\s*)$/, '/Resources << /Font << /F_SH ' + fontRefStr + ' >> >> >>$1');
      }

      modifiedPageStrs[page.objNum] = { genNum: page.genNum, body };
    }

    step = "WRITE";
    const te = new TextEncoder();
    const chunks = [];
    const xrefEntries = [];
    let offset = raw.length;

    chunks.push(te.encode('\n'));
    offset += 1;

    // Font object
    xrefEntries.push({ objNum: fontObjNum, gen: 0, offset });
    const fontStr = fontObjNum + ' 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n';
    const fontBytes = te.encode(fontStr);
    chunks.push(fontBytes);
    offset += fontBytes.length;

    // Content streams
    for (const stream of Object.values(streams)) {
      xrefEntries.push({ objNum: stream.objNum, gen: 0, offset });
      const cb = te.encode(stream.content);
      const hdr = te.encode(stream.objNum + ' 0 obj\n<< /Length ' + cb.length + ' >>\nstream\n');
      const ftr = te.encode('\nendstream\nendobj\n');
      chunks.push(hdr, cb, ftr);
      offset += hdr.length + cb.length + ftr.length;
    }

    // Modified page objects
    for (const [objNumStr, { genNum, body }] of Object.entries(modifiedPageStrs)) {
      const objNum = parseInt(objNumStr);
      xrefEntries.push({ objNum, gen: genNum, offset });
      const objBytes = te.encode(objNum + ' ' + genNum + ' obj\n' + body + '\nendobj\n');
      chunks.push(objBytes);
      offset += objBytes.length;
    }

    // Modified Resources dicts (if any were refs)
    for (const [objNumStr, { genNum, body }] of Object.entries(modifiedResDicts)) {
      const objNum = parseInt(objNumStr);
      xrefEntries.push({ objNum, gen: genNum, offset });
      const objBytes = te.encode(objNum + ' ' + genNum + ' obj\n' + body + '\nendobj\n');
      chunks.push(objBytes);
      offset += objBytes.length;
    }

    // Modified Font dicts (if any were refs)
    for (const [objNumStr, { genNum, body }] of Object.entries(modifiedFontDicts)) {
      const objNum = parseInt(objNumStr);
      xrefEntries.push({ objNum, gen: genNum, offset });
      const objBytes = te.encode(objNum + ' ' + genNum + ' obj\n' + body + '\nendobj\n');
      chunks.push(objBytes);
      offset += objBytes.length;
    }

    // Xref table
    const xrefOffset = offset;
    xrefEntries.sort((a, b) => a.objNum - b.objNum);
    let xrefStr = 'xref\n';
    for (const entry of xrefEntries) {
      xrefStr += entry.objNum + ' 1\n';
      xrefStr += String(entry.offset).padStart(10, '0') + ' ' + String(entry.gen || 0).padStart(5, '0') + ' n \r\n';
    }
    chunks.push(te.encode(xrefStr));

    // Trailer
    let trailerStr = 'trailer\n<< /Size ' + nextObj + ' /Prev ' + prevXref;
    if (rootObjNum) trailerStr += ' /Root ' + rootObjNum + ' ' + rootGenNum + ' R';
    trailerStr += ' >>\nstartxref\n' + xrefOffset + '\n%%EOF\n';
    chunks.push(te.encode(trailerStr));

    // Concatenate
    const totalSize = raw.length + chunks.reduce((s, c) => s + c.length, 0);
    const result = new Uint8Array(totalSize);
    result.set(raw, 0);
    let pos = raw.length;
    for (const chunk of chunks) { result.set(chunk, pos); pos += chunk.length; }

    // --- INKLESS SIGNATURE TAGS ---
    step = "INKLESS";
    const inklessTags = [
      { page: 1, x: 430, y: 707, tag: '\\i1\\' },
      { page: 1, x: 468, y: 707, tag: '\\i2\\' },
      { page: 2, x: 430, y: 739, tag: '\\i1\\' },
      { page: 2, x: 468, y: 739, tag: '\\i2\\' },
      { page: 3, x: 430, y: 739, tag: '\\i1\\' },
      { page: 3, x: 468, y: 739, tag: '\\i2\\' },
      { page: 4, x: 300, y: 130, tag: '\\i1\\' },
      { page: 4, x: 343, y: 130, tag: '\\i2\\' },
      { page: 4, x: 40, y: 305, tag: '\\i1\\' },
      { page: 4, x: 75, y: 305, tag: '\\i2\\' },
      { page: 4, x: 430, y: 739, tag: '\\i1\\' },
      { page: 4, x: 468, y: 739, tag: '\\i2\\' },
      { page: 5, x: 430, y: 739, tag: '\\i1\\' },
      { page: 5, x: 468, y: 739, tag: '\\i2\\' },
      { page: 6, x: 430, y: 739, tag: '\\i1\\' },
      { page: 6, x: 468, y: 739, tag: '\\i2\\' },
      { page: 7, x: 210, y: 82, tag: '\\i1\\' },
      { page: 7, x: 248, y: 83, tag: '\\i2\\' },
      { page: 7, x: 430, y: 739, tag: '\\i1\\' },
      { page: 7, x: 468, y: 739, tag: '\\i2\\' },
      { page: 8, x: 430, y: 739, tag: '\\i1\\' },
      { page: 8, x: 468, y: 739, tag: '\\i2\\' },
      { page: 9, x: 430, y: 739, tag: '\\i1\\' },
      { page: 9, x: 468, y: 739, tag: '\\i2\\' },
      { page: 10, x: 70, y: 324, tag: '\\s1\\' },
      { page: 10, x: 340, y: 324, tag: '\\d1\\' },
      { page: 10, x: 70, y: 370, tag: '\\s2\\' },
      { page: 10, x: 340, y: 370, tag: '\\d2\\' },
      { page: 10, x: 430, y: 739, tag: '\\i1\\' },
      { page: 10, x: 468, y: 739, tag: '\\i2\\' },
      { page: 11, x: 430, y: 739, tag: '\\i1\\' },
      { page: 11, x: 468, y: 739, tag: '\\i2\\' },
    ];
    const pdfDoc = await PDFLib.PDFDocument.load(result);
    const tagFont = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const allPages = pdfDoc.getPages();
    for (const t of inklessTags) {
      const pg = allPages[t.page - 1];
      const pageHeight = pg.getHeight();
      pg.drawText(t.tag, {
        x: t.x,
        y: pageHeight - t.y,
        size: 2,
        font: tagFont,
        color: PDFLib.rgb(1, 1, 1),
      });
    }
    const finalBytes = await pdfDoc.save();
    // --- END INKLESS TAGS ---

    return new Uint8Array(finalBytes);
  } catch(e) {
    throw new Error("[" + step + "] " + e.message);
  }
}

async function generatePDF() {
  STATE.generating = true; render();
  try {
    console.log("[RPA] B/D/E values:", {
      addl_deposit_amount: STATE.form.addl_deposit_amount,
      addl_deposit_date: STATE.form.addl_deposit_date,
      addl_deposit_will: STATE.form.addl_deposit_will,
      assume_loan_amount: STATE.form.assume_loan_amount,
      assume_loan_type: STATE.form.assume_loan_type,
      promissory_amount: STATE.form.promissory_amount,
    });
    const bytes = await fillRPA(STATE.form);
    STATE.pdfSize = bytes ? bytes.length : 0;
    STATE.pdfBytes = bytes;
    const blob = new Blob([bytes], {type:'application/pdf'});
    if (STATE.pdfUrl) URL.revokeObjectURL(STATE.pdfUrl);
    STATE.pdfUrl = URL.createObjectURL(blob);
    STATE.pdfDoc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
    STATE.pdfPageCount = STATE.pdfDoc.numPages;
    STATE.pdfPageNum = 1;
    STATE.view = "preview";
  } catch(e) {
    console.error("RPA generation error:", e);
  }
  STATE.generating = false; render();
}

function downloadPDF() {
  if (!STATE.pdfUrl) return;
  const addr = STATE.form.property_address.split(",")[0].trim().replace(/\s+/g,"_") || "RPA";
  const a = document.createElement("a");
  a.href = STATE.pdfUrl; a.download = `SH_RPA_${addr}.pdf`; a.click();
}

let isSending = false;
async function sendForSignature() {
  if (isSending) return;
  const btn = document.getElementById("signBtn");
  if (!btn || !STATE.pdfUrl) return;
  isSending = true;
  btn.disabled = true; btn.textContent = "⏳ Sending...";
  try {
    const pdfBytes = await fillRPA(STATE.form);
    if (!pdfBytes || !pdfBytes.length) throw new Error("PDF generation returned empty bytes");
    let binary = '';
    const bytes = new Uint8Array(pdfBytes);
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    const pdfBase64 = btoa(binary);
    console.log("[RPA] pdfBase64 length:", pdfBase64.length);
    const agentFull = (STATE.form.listing_agent_name || "").trim();
    const spaceIdx = agentFull.indexOf(" ");
    const listingAgentFirstName = spaceIdx > 0 ? agentFull.substring(0, spaceIdx) : agentFull;
    const listingAgentLastName = spaceIdx > 0 ? agentFull.substring(spaceIdx + 1) : "";
    const payload = {
      pdfBase64,
      address: STATE.form.property_address || "",
      offerPrice: STATE.form.purchase_price || "",
      listingAgentFirstName,
      listingAgentLastName,
      listingAgentEmail: STATE.form.listing_agent_email || ""
    };
    await fetch('https://majordanger.app.n8n.cloud/webhook/rpa-sign', {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    btn.textContent = "Sent ✓";
    btn.style.background = "rgba(34,197,94,0.15)"; btn.style.borderColor = "rgba(34,197,94,0.4)"; btn.style.color = "#22c55e";
  } catch (e) {
    console.error("[RPA] Send for signature error:", e);
    btn.textContent = "✗ Send failed — try again";
    btn.style.background = "rgba(239,68,68,0.15)"; btn.style.borderColor = "rgba(239,68,68,0.4)"; btn.style.color = "#ef4444";
    btn.disabled = false;
    isSending = false;
  }
}

async function renderPdfPage() {
  if (!STATE.pdfDoc) return;
  const canvas = document.getElementById("pdfCanvas");
  if (!canvas) return;
  const page = await STATE.pdfDoc.getPage(STATE.pdfPageNum);
  const scale = (canvas.parentElement.clientWidth - 2) / page.getViewport({scale:1}).width;
  const viewport = page.getViewport({scale});
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
  const label = document.getElementById("pdfPageLabel");
  if (label) label.textContent = `Page ${STATE.pdfPageNum} of ${STATE.pdfPageCount}`;
  const prevBtn = document.getElementById("pdfPrev");
  const nextBtn = document.getElementById("pdfNext");
  if (prevBtn) prevBtn.disabled = STATE.pdfPageNum <= 1;
  if (nextBtn) nextBtn.disabled = STATE.pdfPageNum >= STATE.pdfPageCount;
}

function pdfPrevPage() { if (STATE.pdfPageNum > 1) { STATE.pdfPageNum--; renderPdfPage(); } }
function pdfNextPage() { if (STATE.pdfPageNum < STATE.pdfPageCount) { STATE.pdfPageNum++; renderPdfPage(); } }

function isValid() {
  const pp = parseFloat((STATE.form.purchase_price||"0").replace(/,/g,""));
  return STATE.form.property_address && pp > 0 && STATE.form.coe_date && STATE.form.respond_by_date;
}

function makeField(label, key, width, cls, type, placeholder) {
  const val = STATE.form[key]||"";
  const w = width ? `width:${width}px` : "width:100%";
  const inputCls = cls ? `class="${cls}"` : "";
  const ph = placeholder ? ` placeholder="${placeholder}"` : "";
  if (type === "textarea") {
    return `<div class="field" style="${w}"><label>${label}</label>
      <textarea ${inputCls} rows="5" onchange="set('${key}',this.value)"${ph}>${val}</textarea></div>`;
  }
  if (type === "date") {
    return `<div class="field" style="${w}"><label>${label}</label>
      <input type="date" ${inputCls} value="${val.replace(/"/g,'&quot;')}" onchange="set('${key}',this.value)"${ph}></div>`;
  }
  return `<div class="field" style="${w}"><label>${label}</label>
    <input ${inputCls} value="${val.replace(/"/g,'&quot;')}" oninput="set('${key}',this.value)"${ph}></div>`;
}

function makeSelect(label, key, options, width) {
  const val = STATE.form[key]||"";
  const w = width ? `width:${width}px` : "";
  const opts = options.map(([v,l])=>`<option value="${v}" ${v===val?"selected":""}>${l}</option>`).join("");
  const setter = (key==="loan_type"||key==="assume_loan_type") ? "setStructural" : "set";
  return `<div class="field" style="${w}"><label>${label}</label><select onchange="${setter}('${key}',this.value)">${opts}</select></div>`;
}

  const on = STATE.form[key];
  return `<label class="toggle" style="color:${on?"#e0c97f":"#888"}">
    <div class="toggle-track ${on?"on":"off"}" onclick="setStructural('${key}',!STATE.form['${key}'])">
      <div class="toggle-thumb"></div>
    </div>${label}</label>`;
}

function makeInspRow(label, key) {
  const val = STATE.form.inspections[key]||"";
  return `<div class="insp-row"><span>${label}</span>
    <select onchange="setInsp('${key}',this.value)">
      <option value="" ${!val?"selected":""}>—</option>
      <option value="BUYER" ${val==="BUYER"?"selected":""}>BUYER</option>
      <option value="SELLER" ${val==="SELLER"?"selected":""}>SELLER</option>
      <option value="50/50" ${val==="50/50"?"selected":""}>50/50</option>
      <option value="N/A" ${val==="N/A"?"selected":""}>N/A</option>
      <option value="WAIVED" ${val==="WAIVED"?"selected":""}>WAIVED</option>
    </select></div>`;
}

function section(num, title, body) {
  const open = STATE.openSections[num];
  return `<div class="section">
    <button class="section-header ${open?"open":""}" onclick="toggleSection(${num})">
      <span><span class="num">${String(num).padStart(2,"0")}</span>${title}</span>
      <span class="arrow">▾</span>
    </button>
    ${open ? `<div class="section-body">${body}</div>` : ""}
  </div>`;
}

document.addEventListener("DOMContentLoaded", function(){
  // Check for prefill data from dashboard
  const params = new URLSearchParams(window.location.search);
  if (params.has("prefill")) {
    try {
      const data = JSON.parse(decodeURIComponent(params.get("prefill")));
      // Helper: convert M/D/YYYY or MM/DD/YYYY to YYYY-MM-DD for date inputs
      function toISODate(s) {
        if (!s) return s;
        const p = s.replace(/-/g,"/").split("/");
        if (p.length===3 && p[0].length<=2) {
          return `${p[2]}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`;
        }
        return s;
      }
      const dateFields = ["coe_date","respond_by_date","offer_date","addl_deposit_date"];
      // Merge prefill data into form state
      for (const [key, val] of Object.entries(data)) {
        if (key === "inspections" && typeof val === "object") {
          Object.assign(STATE.form.inspections, val);
        } else if (key === "parcel_number" && !data.apn) {
          // Map parcel_number → apn if apn wasn't explicitly provided
          STATE.form.apn = val;
        } else if (key in STATE.form) {
          STATE.form[key] = dateFields.includes(key) ? toISODate(val) : val;
        }
      }
      // Auto-calc loan amount and balance from purchase price
      if (data.purchase_price) {
        const pp = parseFloat(String(data.purchase_price).replace(/,/g,""));
        if (!isNaN(pp)) {
          STATE.form.loan_amount = STATE.form.loan_amount || String(pp);
          STATE.form.balance_down_payment = STATE.form.balance_down_payment || String(Math.round(pp * 0.10));
        }
      }
      // Open all sections so user can review
      for (let i = 1; i <= 8; i++) STATE.openSections[i] = true;
      // Clean URL
      window.history.replaceState({}, "", window.location.pathname);
    } catch(e) { console.error("Prefill parse error:", e); }
  }
  render();
});
</script>
